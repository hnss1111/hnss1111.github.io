<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도트 게임기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
:root{--px:'Galmuri11','Galmuri9','DotGothic16','Malgun Gothic','Apple SD Gothic Neo',sans-serif;--bd2:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100svh;display:grid;place-items:center;padding:14px;font-family:var(--bd2);color:#394150;background:#1b2130}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
svg{display:block;width:100%;height:auto;image-rendering:pixelated}
:focus-visible{outline:2px dashed #394150;outline-offset:3px}

/* ── 게임기 본체: 가운데 화면 ── */
.console{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:0;width:min(1120px,100%)}
.bezel{position:relative;flex:1;width:100%;min-width:0;background:#2a3142;padding:clamp(8px,1.3vw,14px);padding-bottom:clamp(8px,1.3vw,14px);border-radius:22px;box-shadow:inset 0 0 0 3px #1a2030}
/* 밝은/어두운 화면 스위치: 게임기 테두리와 곡률 영역에서 완전히 분리해 아래쪽 바깥에 배치합니다. */
.tgbar{position:relative;z-index:60;align-self:flex-end;right:auto;bottom:auto;height:auto;display:flex;align-items:center;justify-content:flex-end;gap:8px;width:max-content;margin-top:14px;margin-right:4px;pointer-events:auto}
.tgbar button{position:relative;top:auto;left:auto;right:auto;flex:0 0 auto;width:32px;height:32px;display:grid;place-items:center;color:#8fa0b8;opacity:.9;background:#1f2638;box-shadow:2px 0 0 #0f1422,-2px 0 0 #0f1422,0 2px 0 #0f1422,0 -2px 0 #0f1422;pointer-events:auto;touch-action:manipulation}
.tgbar button svg{width:16px}
.tgbar button.on{background:#c9d4e2;color:#1a2030;opacity:1}
.night-mode .tgbar button{background:#202838;color:#AFC1D8;box-shadow:2px 0 0 #121A27,-2px 0 0 #121A27,0 2px 0 #121A27,0 -2px 0 #121A27}
.night-mode .tgbar button.on{background:#9BC4E8;color:#202838;opacity:1}

/* ── 화면 ── */
.screen{--bg:#dde4ea;--ink:#2f3a4a;--dim:#66737f;--panel:#eef1f3;--bd:#2f3a4a;--shade:#cdd6dd;--dot:#a9b6c3;--b1:#b4c6dc;--b2:#c1d0e2;--b3:#cedae7;--b4:#dbe3ed;--b5:#e8edf2;position:relative;height:clamp(500px,78vh,700px);display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--ink)}
.screen.night{--bg:#202838;--ink:#F0EEE8;--dim:#B2BDCD;--panel:#2B3547;--bd:#141C2A;--shade:#3A465B;--dot:#68788E;--b1:#202B3D;--b2:#253147;--b3:#2C384C;--b4:#324057;--b5:#252F42}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:30;background:repeating-linear-gradient(transparent 0 3px,rgba(0,0,0,.035) 3px 4px)}
.frame{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg);border-radius:14px}
.frame.hm{background:var(--b5)}
.scene{flex:1;min-height:0;overflow-y:auto;padding:clamp(14px,3vw,28px);display:flex;flex-direction:column;scrollbar-width:thin}
.hint{flex:none;display:flex;align-items:center;justify-content:center;min-height:34px;padding:7px 14px;border-top:3px solid var(--bd);background:var(--panel);font-family:var(--px);font-size:11px;color:var(--dim);text-align:center}
.win{background:var(--panel);box-shadow:3px 0 0 var(--bd),-3px 0 0 var(--bd),0 3px 0 var(--bd),0 -3px 0 var(--bd),inset 0 0 0 3px var(--shade);padding:16px 18px}

/* 홈: 게임 고르기 */
.scene.home{position:relative;overflow:hidden}
.deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;background-color:var(--b5);
  /* 배경 격자는 원래처럼 일정하게 이동하되, 선과 배경의 대비를 낮춰 장식 뒤로 물립니다. */
  background-image:
    linear-gradient(90deg,color-mix(in srgb,var(--dot) 24%,transparent) 0 1px,transparent 1px 100%),
    linear-gradient(0deg,color-mix(in srgb,var(--dot) 24%,transparent) 0 1px,transparent 1px 100%);
  background-size:48px 48px,48px 48px;
  background-position:0 0,0 0;
  animation:gm 12s steps(8) infinite}
@keyframes gm{to{background-position:48px 48px,48px 48px}}
/* 상단의 긴 삼색 띠 대신, 리듬 표시처럼 짧게 어긋난 세 개의 막대 */
.deco::after{content:"";position:absolute;top:24px;right:clamp(18px,4vw,44px);width:34px;height:4px;background:var(--g1);box-shadow:-11px 8px 0 var(--g2),-22px 16px 0 var(--g3);opacity:.22;transform:rotate(-12deg);animation:accentBeat 7.2s steps(1,end) infinite}
@keyframes accentBeat{0%,83%,100%{opacity:.16;transform:translateY(0) rotate(-12deg)}86%{opacity:.28;transform:translateY(-3px) rotate(-12deg)}89%{opacity:.16;transform:translateY(0) rotate(-12deg)}}
.deco .sh{position:absolute;bottom:-80px;color:var(--c);opacity:.43;animation-name:float;animation-timing-function:steps(30);animation-iteration-count:infinite}
.deco .sh svg{width:100%;height:auto;overflow:visible}
.screen.night .deco .sh{opacity:.58}
.deco .sh .form{opacity:0;animation-duration:var(--swap-duration,9s);animation-delay:var(--swap-delay,0s);animation-timing-function:steps(1,end);animation-iteration-count:infinite}
.deco .sh .form-a{animation-name:formA}
.deco .sh .form-b{animation-name:formB}
.deco .sh .form-c{animation-name:formC}
@keyframes formA{0%,32%{opacity:1}33%,100%{opacity:0}}
@keyframes formB{0%,32%{opacity:0}33%,65%{opacity:1}66%,100%{opacity:0}}
@keyframes formC{0%,65%{opacity:0}66%,100%{opacity:1}}
@keyframes float{0%{transform:translate(0,0)}25%{transform:translate(14px,-225px)}50%{transform:translate(-10px,-450px)}75%{transform:translate(12px,-675px)}100%{transform:translate(0,-900px)}}
.stage{position:relative;flex:1;min-height:270px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.stage.dragging{cursor:grabbing}
.track{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}

/* ── 투명 앨범 케이스 (가로로 살짝 긴 1:1 느낌) + 오른쪽 끝 연결부에서 CD가 나와요 ── */
.cd{position:absolute;left:0;top:0;width:clamp(104px,22vw,186px);will-change:transform;touch-action:none;cursor:pointer}
.cs{position:relative;display:block;aspect-ratio:9/8;--edge:color-mix(in srgb,var(--ink) 60%,transparent)}
.disc{position:absolute;right:-15%;top:9%;width:74%;z-index:1;transition:transform .3s steps(4)}
.cd.on .disc{transform:translateX(26%)}
.cd.on .disc svg{animation:spin 4.2s steps(24) infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.cf{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 30%,transparent),color-mix(in srgb,var(--c) 10%,transparent) 60%,color-mix(in srgb,var(--c) 22%,transparent));box-shadow:3px 0 0 var(--edge),-3px 0 0 var(--edge),0 3px 0 var(--edge),0 -3px 0 var(--edge),inset 3px 3px 0 rgba(255,255,255,.45),inset -3px -3px 0 rgba(0,0,0,.14)}
.cf::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 22%,rgba(255,255,255,.34) 22% 29%,transparent 29% 36%,rgba(255,255,255,.2) 36% 39%,transparent 39%)}
.c-bk{position:absolute;left:6%;top:9%;width:70%;bottom:9%;background:var(--tint);box-shadow:0 0 0 3px #f7f2e6}
.c-lab{position:absolute;left:7%;top:8%;width:86%;aspect-ratio:20/16;overflow:hidden;background:var(--tint);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 55%,#2a3142)}
.c-lab svg{width:100%;height:100%}
.c-dots{position:absolute;left:7%;bottom:9%;display:flex;gap:5px}
.c-dots i{width:7px;height:7px}
.c-hg{position:absolute;right:0;top:0;bottom:0;width:13%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12%;background:color-mix(in srgb,var(--c) 60%,#2a3142);box-shadow:inset 3px 0 0 rgba(0,0,0,.28),inset 6px 0 0 rgba(255,255,255,.14)}
.c-hg i{width:34%;aspect-ratio:1;background:#f7f2e6;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.cd.on .cf{box-shadow:4px 0 0 var(--c),-4px 0 0 var(--c),0 4px 0 var(--c),0 -4px 0 var(--c),inset 3px 3px 0 rgba(255,255,255,.5),0 0 16px color-mix(in srgb,var(--c) 40%,transparent)}
.cn{display:block;width:max-content;max-width:100%;margin:14px auto 0;padding:3px 9px;background:var(--panel);color:var(--ink);font-family:var(--px);font-size:clamp(11px,1.25vw,14px);line-height:1.4;word-break:keep-all;box-shadow:3px 0 0 var(--bd),-3px 0 0 var(--bd),0 3px 0 var(--bd),0 -3px 0 var(--bd)}
.cd.on .cn{box-shadow:3px 0 0 var(--c),-3px 0 0 var(--c),0 3px 0 var(--c),0 -3px 0 var(--c)}
.bk{margin-left:auto;padding:6px 10px;background:var(--shade);color:var(--ink);font-family:var(--px);font-size:11px}
.bk:hover{background:var(--c)}
.gh .bk~.bk{margin-left:0}
/* 설명 바: 화면 전체와 같이 곡면 왜곡을 받아요 */
.sayw{flex:none;padding:0 clamp(14px,3vw,28px) 18px}
.say{margin:0 auto;width:min(520px,100%);text-align:center;font-size:13px;line-height:1.7}
.say em{display:block;margin-top:4px;font-family:var(--px);font-style:normal;font-size:11px;color:var(--dim);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}

/* 게임마다 다른 배경 */
.g-plat{background:conic-gradient(color-mix(in srgb,var(--c) 22%,var(--bg)) 25%,color-mix(in srgb,var(--c) 10%,var(--bg)) 0 50%,color-mix(in srgb,var(--c) 22%,var(--bg)) 0 75%,color-mix(in srgb,var(--c) 10%,var(--bg)) 0) 0 0/48px 48px;animation:slide 6s steps(24) infinite}
@keyframes slide{to{background-position:0 0,48px 48px}}
.screen.night .g-plat{background:conic-gradient(color-mix(in srgb,var(--c) 14%,var(--bg)) 25%,color-mix(in srgb,var(--c) 7%,var(--bg)) 0 50%,color-mix(in srgb,var(--c) 14%,var(--bg)) 0 75%,color-mix(in srgb,var(--c) 7%,var(--bg)) 0) 0 0/48px 48px;animation:slide 6s steps(24) infinite}
.g-story{background:#f5ebd3}
.screen.night .g-story{background:#2E2E3D}
.g-cut{background:linear-gradient(transparent 0 8px,var(--bg) 8px 20px,transparent 20px) 6px 0/10px 28px repeat-y,linear-gradient(transparent 0 8px,var(--bg) 8px 20px,transparent 20px) calc(100% - 6px) 0/10px 28px repeat-y,linear-gradient(90deg,#2a3142 0 22px,transparent 22px calc(100% - 22px),#2a3142 0),color-mix(in srgb,var(--c) 14%,var(--bg));animation:film 3.5s steps(7) infinite}
.screen.night .g-cut{background:linear-gradient(transparent 0 8px,var(--bg) 8px 20px,transparent 20px) 6px 0/10px 28px repeat-y,linear-gradient(transparent 0 8px,var(--bg) 8px 20px,transparent 20px) calc(100% - 6px) 0/10px 28px repeat-y,linear-gradient(90deg,#141C2A 0 22px,transparent 22px calc(100% - 22px),#141C2A 0),color-mix(in srgb,var(--c) 12%,var(--bg));animation:film 3.5s steps(7) infinite}
@keyframes film{to{background-position:6px 28px,calc(100% - 6px) 28px,0 0}}
.scene.g-cut{padding-left:46px;padding-right:46px}
.gh{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-family:var(--px);font-size:clamp(17px,2.4vw,22px);color:var(--c)}
.gh svg{width:28px;flex:none}

/* 사용 플랫폼: RPG 메뉴 */
.rpg{display:grid;grid-template-columns:1fr 1.4fr;gap:20px;align-items:start}
.menu{display:flex;flex-direction:column;gap:4px}
.mi{display:flex;align-items:center;gap:8px;text-align:left;padding:8px 10px;font-family:var(--px);font-size:13px;color:var(--ink)}
.mi i{width:12px;font-style:normal;color:var(--c);visibility:hidden}
.mi.on{background:color-mix(in srgb,var(--c) 30%,transparent)}
.mi.on i{visibility:visible;animation:blink .8s steps(2) infinite}
.info h3{margin:0 0 8px;font-family:var(--px);font-weight:400;font-size:17px;color:var(--c)}
.info p{margin:0 0 14px;font-size:13px;line-height:1.8}
.go{display:inline-block;padding:6px 12px;background:var(--c);color:#2a3142;font-family:var(--px);font-size:12px}
.info .pt{margin:0 0 8px;font-family:var(--px);font-weight:400;font-size:12px;color:var(--dim)}
.pfs{display:flex;flex-wrap:wrap;gap:8px}
.pf{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:var(--c);color:#2a3142;font-family:var(--px);font-size:12px}
.pf em{font-style:normal}
.pf:hover{filter:brightness(1.06)}
.info .no{margin:0;font-size:12px;color:var(--dim)}

/* 사담: 대화창 */
.vn{display:grid;grid-template-columns:minmax(150px,.4fr) 1fr;gap:20px;align-items:start}
.slots{display:flex;flex-direction:column;gap:6px;min-width:0}
.st-crumb{padding:0 0 9px;margin-bottom:3px;border-bottom:2px dashed var(--shade);font-family:var(--px);font-size:10px;line-height:1.7;color:var(--dim);overflow-wrap:anywhere}
.st-crumb span{color:var(--c);padding:0 3px}
.sl{text-align:left;padding:9px 10px;font-family:var(--px);font-size:12px;line-height:1.5;color:var(--ink);background:var(--shade);overflow-wrap:anywhere}
.sl small{display:block;margin-top:3px;font-family:var(--bd2);font-size:11px;color:var(--dim)}
.sl.on{background:var(--c);color:#202838}.sl.on small{color:#344253}
.stg h3{margin:0 0 5px;font-family:var(--px);font-weight:400;font-size:clamp(18px,2.4vw,24px);overflow-wrap:anywhere}
.stg .dt{font-size:11px;color:var(--dim);margin-bottom:14px;line-height:1.7}
.stg .st-copy{margin:0 0 14px;font-size:13px;line-height:1.9}
.stg .st-pills{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 16px}
.stg .st-pill{padding:5px 8px;background:var(--shade);font-family:var(--px);font-size:10px;color:var(--ink)}
.stg .st-action{display:inline-block;padding:7px 11px;background:var(--c);color:#202838;font-family:var(--px);font-size:11px}
.stg .st-below{margin-top:14px;display:flex;justify-content:flex-end}
.dlg{position:relative;padding:16px 18px}
.nm{position:static;display:table;max-width:100%;margin:0 0 8px;padding:3px 10px;background:var(--c);color:#202838;font-family:var(--px);font-size:12px;line-height:1.5;box-shadow:3px 0 0 var(--bd),-3px 0 0 var(--bd),0 3px 0 var(--bd),0 -3px 0 var(--bd)}
.st-category{font-family:var(--px);font-size:10px;color:var(--dim);margin:0 0 14px}
.dlg p{margin:0 0 14px;font-size:14px;line-height:2}.dlg p:last-child{margin-bottom:0}
.nx{position:absolute;right:14px;bottom:8px;font-style:normal;font-family:var(--px);color:var(--c);animation:blink .8s steps(2) infinite}

/* 사담 글쓰기/편집 도구 */
.st-tools{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 9px}
.st-tool{padding:6px 8px;background:var(--panel);color:var(--ink);font-family:var(--px);font-size:10px;line-height:1.4;box-shadow:2px 0 0 var(--bd),-2px 0 0 var(--bd),0 2px 0 var(--bd),0 -2px 0 var(--bd)}
.st-tool.primary{background:var(--c);color:#202838}
.st-editor{display:flex;flex-direction:column;gap:10px}
.st-editor h3{margin:0;font-family:var(--px);font-weight:400;font-size:18px}
.st-editor .st-help{margin:0;color:var(--dim);font-size:11px;line-height:1.7}
.st-field{display:flex;flex-direction:column;gap:5px;min-width:0}
.st-field label{font-family:var(--px);font-size:11px;color:var(--dim)}
.st-field input,.st-field select,.st-field textarea{width:100%;min-width:0;border:2px solid var(--shade);border-radius:0;background:var(--bg);color:var(--ink);padding:9px 10px;font:13px var(--bd2);outline-offset:2px}
.st-field select{font-family:var(--px);font-size:11px}
.st-field textarea{min-height:190px;resize:vertical;line-height:1.8}
.st-fields-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st-select-action{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.st-editor-actions{display:flex;flex-wrap:wrap;gap:7px;padding-top:4px}
.st-editor-actions .st-action{border:0;cursor:pointer}
.st-editor-actions .st-cancel{padding:7px 11px;background:var(--shade);color:var(--ink);font-family:var(--px);font-size:11px}
.st-edit-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:7px;margin-top:14px}
.st-edit-actions button{padding:6px 9px;background:var(--shade);color:var(--ink);font-family:var(--px);font-size:10px}
.st-edit-actions .danger{background:#D9A1A8;color:#34232A}
.st-empty{padding:14px;background:var(--shade);font-size:12px;color:var(--dim);line-height:1.7}
@media(max-width:820px){.st-fields-2{grid-template-columns:1fr}.st-tools{margin-bottom:5px}}

/* 이미지: 앨범 */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tb{padding:8px 12px;font-family:var(--px);font-size:12px;background:var(--shade);color:var(--ink)}
.tb.on{background:var(--c);color:#2a3142}
.gg{width:100%;max-width:100%;min-width:0;margin:0 0 20px}
.gg h4{margin:0 0 10px;font-family:var(--px);font-weight:400;font-size:13px;color:var(--dim)}
.grid{display:grid;width:100%;max-width:100%;min-width:0;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid.portrait{grid-template-columns:repeat(4,minmax(0,1fr))}
.shot{display:block;width:100%;max-width:100%;min-width:0;text-align:left;--c:#f0a3b6;transition:transform .12s steps(2)}
.shot:hover{transform:translateY(-3px)}
.sv{display:block;aspect-ratio:var(--ratio);background:var(--panel);overflow:hidden;box-shadow:3px 0 0 var(--bd),-3px 0 0 var(--bd),0 3px 0 var(--bd),0 -3px 0 var(--bd)}
.sv img{width:100%;height:100%;object-fit:contain;display:block}
.ph{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:100%;font-family:var(--px);font-size:12px;color:var(--dim);border:2px dashed var(--c)}
.ph svg{width:24px}
.sc{display:block;box-sizing:border-box;width:100%;max-width:100%;min-width:0;padding:8px 1px 0;font-size:12px;line-height:1.5;white-space:normal;overflow-wrap:anywhere;word-break:break-word}
.emp{display:flex;flex-direction:column;align-items:center;gap:8px;padding:30px 0 10px;text-align:center}
.emp-st{display:flex;flex-wrap:wrap;justify-content:center;gap:22px;margin-bottom:14px}
.pk{display:flex;flex-direction:column;align-items:center;--k:#f0a3b6}
.pk .pl{width:clamp(76px,14vw,116px);aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px;background:color-mix(in srgb,var(--k) 22%,var(--panel));box-shadow:3px 0 0 var(--bd),-3px 0 0 var(--bd),0 3px 0 var(--bd),0 -3px 0 var(--bd);animation:bob 1.2s steps(2) infinite}
.pk:nth-child(2) .pl{animation-delay:.3s}.pk:nth-child(3) .pl{animation-delay:.6s}.pk:nth-child(4) .pl{animation-delay:.9s}
.pk .pl svg{width:42%;flex:none}
.pk .pl-name{display:block;max-width:100%;padding:4px 5px;background:var(--k);color:#202838;font-family:var(--px);font-size:clamp(9px,1vw,12px);line-height:1.35;overflow-wrap:anywhere;text-align:center;box-shadow:2px 0 0 var(--bd),-2px 0 0 var(--bd),0 2px 0 var(--bd),0 -2px 0 var(--bd)}
.pk.on .pl{box-shadow:3px 0 0 var(--k),-3px 0 0 var(--k),0 3px 0 var(--k),0 -3px 0 var(--k)}
.pk.on .pl-name,.pk:hover .pl-name{filter:brightness(1.06)}
@keyframes bob{50%{transform:translateY(-6px)}}
.emp b{font-family:var(--px);font-weight:400;font-size:15px;color:var(--ink)}
.emp em{font-style:normal;font-size:12px;color:var(--dim)}

/* 로딩/전환 화면 */
.boot{position:absolute;inset:0;z-index:20;display:none;place-items:center;background:var(--c);clip-path:circle(0)}
.boot.on{display:grid;animation:iris .35s steps(5) forwards}

function mixHex(a,b,t){

  for(let y=0;y<16;y++)for(let x=0;x<16;x++){
    const d=Math.hypot(x-m,y-m);if(d>7.9||d<1.6)continue;
    let f=c;

    else if(d>7)f=rim;

  const g=$('#tg');if(g)g.setAttribute('transform',`rotate(${-pos*STEP} ${W/2} ${py})`);
}
function sync(i){
  sel=((i%N)+N)%N;const say=$('#say');
  if(say)say.innerHTML=`${G[sel].name} · ${G[sel].hint}<em>▶ 가운데 시디를 눌러 시작</em>`;
}
function stepAnim(now=0){
  /* 작게 끊어 움직이는 느린 도트식 이동 */
  if(now-lastTick<42){raf=requestAnimationFrame(stepAnim);return}
  lastTick=now;const diff=target-pos;
  pos+=Math.sign(diff)*Math.min(Math.abs(diff),.052);
  if(Math.abs(target-pos)<.006){pos=target;raf=0;draw();return}
  draw();raf=requestAnimationFrame(stepAnim);
}
function rotate(n){target+=n;sync(Math.round(target));if(!raf)raf=requestAnimationFrame(stepAnim)}
function finishDrag(e){
  if(!drag||(e&&e.pointerId!==drag.pointerId))return;
  stage.classList.remove('dragging');
  if(drag.moved){suppress=performance.now()+420;target=Math.round(pos);sync(target);if(!raf)raf=requestAnimationFrame(stepAnim)}
  drag=null;
}
function bindDrag(){
  stage.addEventListener('pointerdown',e=>{if(where!=='home'||busy||e.button>0)return;drag={pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,startPos:pos,moved:false}});
  stage.addEventListener('pointermove',e=>{
    if(!drag||e.pointerId!==drag.pointerId)return;
    const dx=e.clientX-drag.startX,dy=e.clientY-drag.startY;
    if(!drag.moved&&Math.abs(dx)>7&&Math.abs(dx)>Math.abs(dy)*.75){drag.moved=true;stage.classList.add('dragging');try{stage.setPointerCapture(e.pointerId)}catch(_){}}
    if(!drag.moved)return;e.preventDefault();
    pos=drag.startPos-dx/Math.max(90,R*Math.sin(STEP*Math.PI/180));target=pos;
    const nx=((Math.round(pos)%N)+N)%N;if(nx!==sel)sync(nx);draw();
  },{passive:false});
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>stage.addEventListener(t,finishDrag));
}

/* 게임 시작/종료 연출
   시작: 곡면이 먼저 천천히 펴짐 → 동그란 로딩 화면이 열렸다 닫히며 내용 교체
   종료: 평평한 채로 내용 교체 → 곡면이 천천히 다시 휘어짐 */
async function transition(g,label,fn,curveAfter){
  if(busy)return;busy=true;
  if(!curveAfter)await curveTo(0,480);
  boot.style.setProperty('--c',g.c);
  boot.innerHTML=`<div class="bt">${icon(g.icon,'#2a3142','#fff','#fff')}<b>${g.name}</b><em>${label}<u>.</u><u>.</u><u>.</u></em></div>`;
  boot.className='boot on';
  await wait(label==='LOADING'?950:600);
  if(curveAfter){
    /* 메인으로 돌아갈 때는 로딩 화면이 덮여 있는 동안 곡률을 먼저 시작해요. */
    const curveMotion=curveTo(1,600);
    await wait(240);
    fn();scene.scrollTop=0;boot.className='boot off';
    await wait(380);boot.className='boot';
    await curveMotion;
  }else{
    fn();scene.scrollTop=0;boot.className='boot off';
    await wait(380);boot.className='boot';
  }
  busy=false;
}
function start(id){const g=G.find(x=>x.id===id);transition(g,'LOADING',()=>enter(id),false)}
function exit(){if(where==='home')return;const g=G.find(x=>x.id===where);transition(g,'SAVING',()=>{clearInterval(tm);home()},true)}
function enter(id){
  where=id;frame.classList.remove('hm');sayw.style.display='none';const g=G.find(x=>x.id===id);setLoc('▶ '+g.name);
  scene.style.setProperty('--c',g.c);scene.className='scene g-'+id;
  ({plat:plat,story:story,cut:cut})[id]();
  const bk=document.createElement('button');bk.className='bk';bk.textContent='← 홈';bk.addEventListener('click',exit);scene.querySelector('.gh').appendChild(bk);
}

/* 2. 사담 : 큰 맥락 → 작은 맥락 → 글 제목 → 본문 */
function storyEscape(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function storyDisplayDate(value){
  const s=String(value||'');
  return /^\d{4}-\d{2}-\d{2}$/.test(s)?s.replace(/-/g,'.'):s;
}
function normalizeStoryData(rows){
  if(!Array.isArray(rows))throw new Error('게시글 데이터가 배열 형식이 아닙니다.');
  /* 이전 계층형 데이터도 평탄화하여 카테고리 + 태그 구조로 읽습니다. */
  const flatRows=[];
  rows.forEach(row=>{
    if(!row||typeof row!=='object')return;
    if(Array.isArray(row.topics)){
      row.topics.forEach(topic=>{
        (topic.entries||[]).forEach(entry=>flatRows.push({
          category:row.title,subcategory:topic.title,title:entry.title,date:entry.date,body:entry.body
        }));
      });
    }else flatRows.push(row);
  });
  const categories=[];
  flatRows.forEach(row=>{
    if(!row||typeof row!=='object')return;
    const categoryName=String(row.category||'미분류').trim()||'미분류';
    const tagName=String(row.subcategory||'기타').trim()||'기타';
    let category=categories.find(item=>item.title===categoryName);
    if(!category){category={title:categoryName,entries:[]};categories.push(category)}
    let body=[];
    if(Array.isArray(row.body))body=row.body.map(v=>String(v)).filter(v=>v.trim());
    else body=String(row.body||'').split(/\n\s*\n/).map(v=>v.trim()).filter(Boolean);
    category.entries.push({
      topicTitle:tagName,
      title:String(row.title||'제목 없음'),
      date:storyDisplayDate(row.date),
      body
    });
  });
  return categories;
}
async function loadStoryData(){
  const requestId=++storyLoadSerial;
  storyLoadState='loading';storyLoadError='';STORIES=[];drawStory();
  try{
    const response=await fetch(STORY_DATA_URL,{cache:'no-store'});
    if(!response.ok)throw new Error('HTTP '+response.status);
    const raw=await response.json();
    const data=normalizeStoryData(raw);
    if(requestId!==storyLoadSerial||where!=='story')return;
    STORIES=data;storyLoadState='ready';storyLoadError='';
    stCat=0;stTopic=-1;stEntry=0;stLevel='list';drawStory();
  }catch(err){
    if(requestId!==storyLoadSerial||where!=='story')return;
    storyLoadState='error';storyLoadError=String(err&&err.message||err);STORIES=[];drawStory();
  }
}
function story(){
  const g=G[1];

    <div class="blog-shell" id="blogShell">

        <div class="blog-main-head"><div class="blog-section-title" id="blogSectionTitle">사담 보관함</div><div class="blog-section-meta" id="blogSectionMeta">기록을 모아 둔 곳</div><div class="blog-topics" id="blogTopics"></div></div>
        <div class="blog-columns">
          <section class="blog-postlist" id="blogPostList" aria-label="게시글 목록"></section>
          <article class="blog-article" id="blogArticle" aria-live="polite"></article>
        </div>

function storyTags(){
  if(!STORIES.length||!STORIES[stCat])return [];
  return [...new Set((STORIES[stCat].entries||[]).map(entry=>String(entry.topicTitle||'기타')))].filter(Boolean);
}
function storyVisibleEntries(){
  if(!STORIES.length||!STORIES[stCat])return [];
  const cat=STORIES[stCat],tags=storyTags();
  const all=cat.entries||[];
  const filtered=stTopic<0?all:all.filter(entry=>String(entry.topicTitle||'기타')===tags[stTopic]);
  return filtered.map(entry=>({
    title:String(entry.title||'제목 없음'),date:String(entry.date||''),body:Array.isArray(entry.body)?entry.body:[],
    categoryTitle:cat.title,topicTitle:String(entry.topicTitle||'기타')
  })).sort((a,b)=>{
    const da=String(a.date||'').replace(/\./g,'-'),db=String(b.date||'').replace(/\./g,'-');
    return db.localeCompare(da);
  });
}
function storyItems(){return storyVisibleEntries()}
function storyIndex(){return stEntry}
function setStoryIndex(i){stEntry=i}
function storyOpen(){stLevel='article';drawStory()}
function storyBack(){
  if(stLevel==='article'){stLevel='list';drawStory()}

function storySelect(i){stEntry=i;stLevel='article';drawStory()}
function drawStory(){

  if(!sidebar||!topicsBox||!titleBox||!metaBox||!postList||!article||!shell)return;

    article.innerHTML=`<div class="blog-status"><strong>게시글을 불러오지 못했어요.</strong><p>GitHub 저장소에 <code>data/stories.json</code> 파일이 있는지, 홈페이지가 GitHub Pages 주소에서 열려 있는지 확인해 주세요.</p><p>오류: ${storyEscape(storyLoadError)}</p><button class="st-action" id="stRetry">다시 불러오기</button></div>`;
    $('#stRetry').addEventListener('click',loadStoryData);setHint('게시글 불러오기 오류 · Esc로 홈으로');return;

    sidebar.innerHTML='<div class="blog-side-label">카테고리</div><p class="st-copy">아직 분류가 없어요.</p>';topicsBox.innerHTML='';postList.innerHTML='';
    article.innerHTML='<div class="blog-status">아직 게시글이 없어요.<br>Pages CMS에서 첫 게시글을 저장하면 여기에 표시됩니다.</div>';
    titleBox.textContent='사담 보관함';metaBox.textContent='아직 등록된 글이 없습니다.';setHint('게시글은 Pages CMS에서 관리');return;
  }
  stCat=Math.max(0,Math.min(stCat,STORIES.length-1));
  const cat=STORIES[stCat];
  if(!cat.entries)cat.entries=[];
  const tags=storyTags();
  if(stTopic>=tags.length)stTopic=-1;
  let entries=storyVisibleEntries();
  if(entries.length)stEntry=Math.max(0,Math.min(stEntry,entries.length-1));else stEntry=0;
  sidebar.innerHTML=`<div class="blog-side-label">카테고리</div><div class="blog-side-list">${STORIES.map((c,i)=>{
    const count=(c.entries||[]).length;
    return `<button class="blog-cat${i===stCat?' on':''}" data-cat="${i}"><span>${storyEscape(c.title)}</span><small>${count}</small></button>`;
  }).join('')}</div>`;
  sidebar.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{stCat=+b.dataset.cat;stTopic=-1;stEntry=0;stLevel='list';drawStory()}));
  topicsBox.innerHTML=`<button class="blog-topic${stTopic<0?' on':''}" data-topic="-1">전체 글 <span>· ${(cat.entries||[]).length}</span></button>`+tags.map((tag,i)=>{
    const count=(cat.entries||[]).filter(entry=>String(entry.topicTitle||'기타')===tag).length;
    return `<button class="blog-topic${i===stTopic?' on':''}" data-topic="${i}">${storyEscape(tag)} <span>· ${count}</span></button>`;
  }).join('');
  topicsBox.querySelectorAll('[data-topic]').forEach(b=>b.addEventListener('click',()=>{stTopic=+b.dataset.topic;stEntry=0;stLevel='list';drawStory()}));
  entries=storyVisibleEntries();

  metaBox.textContent=`${stTopic<0?'전체 게시글':'태그: '+tags[stTopic]} · ${entries.length}개의 글`;
  if(!entries.length){
    postList.innerHTML='<div class="blog-status">이 분류에는 아직 게시글이 없어요.</div>';
    article.innerHTML='<div class="blog-article-empty">아직 등록된 글이 없어요.</div>';
    shell.classList.remove('article-open');setHint('카테고리를 선택하고 태그로 글을 걸러 보세요 · Esc 홈으로');return;
  }
  stEntry=Math.max(0,Math.min(stEntry,entries.length-1));
  postList.innerHTML=`<div class="blog-list-heading">게시글 목록 · ${entries.length}</div>`+entries.map((entry,i)=>{
    const excerpt=entry.body.join(' ').replace(/\s+/g,' ').trim();
    return `<button class="blog-post${i===stEntry?' on':''}" data-post="${i}"><span class="blog-post-meta">#${storyEscape(entry.topicTitle)} · ${storyEscape(entry.date)}</span><span class="blog-post-title">${storyEscape(entry.title)}</span><span class="blog-post-excerpt">${storyEscape(excerpt.slice(0,76))}${excerpt.length>76?'…':''}</span></button>`;
  }).join('');
  postList.querySelectorAll('[data-post]').forEach(b=>b.addEventListener('click',()=>storySelect(+b.dataset.post)));
  const selected=entries[stEntry];
  if(stLevel==='article'&&selected){
    shell.classList.add('article-open');
    article.innerHTML=`<button class="blog-back" data-blog-back>← 게시글 목록</button><div class="blog-article-kicker">${storyEscape(selected.categoryTitle)}　/　#${storyEscape(selected.topicTitle)}</div><h3>${storyEscape(selected.title)}</h3><div class="blog-article-date">${storyEscape(selected.date)}</div><div class="blog-article-body">${selected.body.map(t=>`<p>${storyEscape(t).replace(/\n/g,'<br>')}</p>`).join('')}</div>`;
    const back=article.querySelector('[data-blog-back]');if(back)back.addEventListener('click',()=>{stLevel='list';drawStory()});
  }else{
    shell.classList.remove('article-open');
    article.innerHTML=`<div class="blog-article-empty">${icon('bubble','var(--c)')}<strong>읽고 싶은 글을 선택해 주세요.</strong><span>게시글 제목을 누르면 본문이 여기에 표시됩니다.</span></div>`;
  }
  setHint(stLevel==='article'?'게시글 읽기 · Esc로 목록으로 돌아가기':'카테고리는 큰 분류, 상단 태그는 글 필터 · 게시글 제목을 눌러 읽기');

/* 버튼 입력 (키보드·화면 버튼 공통) */
function press(k){
  if($('#lb').classList.contains('on')){if(k==='b'||k==='a')$('#lb').classList.remove('on');return}
  if(busy)return;
  if(where==='home'){
    if(k==='l')rotate(-1);else if(k==='r')rotate(1);else if(k==='a')start(G[sel].id);
  }else if(where==='plat'){
    if(k==='u'){pi=(pi+CHARS.length-1)%CHARS.length;drawPlat()}
    else if(k==='d'){pi=(pi+1)%CHARS.length;drawPlat()}
    else if(k==='b')exit();
  }else if(where==='story'){
    const items=storyItems();
    if(k==='u'||k==='d'){
      if(items.length){const next=(storyIndex()+(k==='d'?1:items.length-1))%items.length;setStoryIndex(next);drawStory();}
    }else if(k==='a'){
      if(storyLoadState!=='ready'||!STORIES.length)return;
      if(stLevel==='article'){
        const before=scene.scrollTop;scene.scrollBy(0,140);
        if(scene.scrollTop===before)toast('글을 다 읽었어요. Esc로 목록으로 돌아갈 수 있어요.');
      }else if(items.length)storyOpen();
    }else if(k==='b')storyBack();
  }else if(where==='cut'){
    const L=ALBUMS.length;
    if(ai<0){
      if(k==='l'||k==='r'){ci=(ci+(k==='r'?1:L-1))%L;drawAlbum()}
      else if(k==='a'){ai=ci;drawAlbum()}
      else if(k==='b')exit();
    }else{
      if(k==='l'||k==='r'){ai=(ai+(k==='r'?1:L-1))%L;ci=ai;drawAlbum()}
      else if(k==='u')scene.scrollBy(0,-90);else if(k==='d')scene.scrollBy(0,90);
      else if(k==='b'){ai=-1;drawAlbum()}
    }
  }
}
const KEYS={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d',Enter:'a',' ':'a',Escape:'b',Backspace:'b'};
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea,select,[contenteditable="true"]')){if(e.key==='Escape'&&stEditing){e.preventDefault();stEditing=false;stEditTarget=null;drawStory()}return}const k=KEYS[e.key];if(!k)return;if(e.target.closest&&e.target.closest('button,a')&&(e.key==='Enter'||e.key===' '))return;e.preventDefault();press(k)});

/* 테마 */
$('#tLight').innerHTML=icon('sun','currentColor');$('#tDark').innerHTML=icon('moon','currentColor');
function theme(n){
  night=n;document.body.classList.toggle('night-mode',n);document.body.classList.toggle('day-mode',!n);scr.classList.toggle('night',n);bez.classList.toggle('night-mode',n);$('#tDark').classList.toggle('on',n);$('#tLight').classList.toggle('on',!n);
  const P=n?PAL.night:PAL.day;G.forEach((g,i)=>g.c=P[i]);
  if(where==='home')home();else enter(where);
}
$('#tLight').addEventListener('click',()=>theme(false));$('#tDark').addEventListener('click',()=>theme(true));
$('#lb').addEventListener('click',()=>$('#lb').classList.remove('on'));
theme(false);
</script>
