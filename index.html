<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17191d">
<title>도트 서랍</title>
<!-- 도트 한글 폰트(갈무리, 무료). 불러오지 못하면 대체 한글 폰트가 쓰입니다 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
:root{
  --bg:#1b1e24; --bg2:#282d36; --line:#454d59;
  --blue:#91b5d5; --butter:#d7bb77; --rose:#d39ba9; --mint:#a4bda7;
  --ink:#eee9dd; --dim:#a3a9b3;
  --font-pixel:'Galmuri11','Galmuri9','DotGothic16','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  --font-body:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  --h:clamp(500px,76vh,780px);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0b0d11}
body{color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.75;overflow-x:hidden;
  background:radial-gradient(ellipse at 50% 28%,#272d36 0,#14171d 43%,#090b0f 84%)}
button,.eyebrow,.head h2,.selected-label,.case-top,.case-name,.plat-num,.plat em,.story-item .num,.story-paper .tag,.story-paper-bottom,.album-tab,.shot-num,.foot{font-family:var(--font-pixel)}
button,a{font:inherit;color:inherit}button{cursor:pointer}
svg{display:block;width:100%;height:auto;image-rendering:pixelated}
:focus-visible{outline:2px dashed var(--blue);outline-offset:4px}
.px{--c:var(--blue);background:var(--bg2);margin:4px;
  box-shadow:4px 0 0 0 var(--c),-4px 0 0 0 var(--c),0 4px 0 0 var(--c),0 -4px 0 0 var(--c)}

.grain{position:fixed;inset:0;z-index:50;pointer-events:none;opacity:.05;animation:jit .2s steps(2) infinite;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.trail{position:fixed;z-index:90;width:6px;height:6px;pointer-events:none;animation:dust .5s steps(5) forwards}
.toast{position:fixed;left:50%;bottom:26px;z-index:120;transform:translateX(-50%);background:var(--bg2);color:var(--ink);padding:8px 14px;--c:var(--blue);font-size:13px;
  box-shadow:4px 0 0 var(--c),-4px 0 0 var(--c),0 4px 0 var(--c),0 -4px 0 var(--c);opacity:0;pointer-events:none}
.toast.on{animation:toast 1.8s steps(6) forwards}

/* ───── 모니터 본체 ───── */
.monitor{position:relative;width:min(1180px,97vw);margin:3vh auto;border-radius:34px;
  padding:clamp(10px,1.7vw,24px) clamp(10px,1.7vw,24px) clamp(52px,7vw,86px);
  background:linear-gradient(145deg,#454d59 0%,#20242b 22%,#343b46 54%,#111319 90%);
  box-shadow:0 44px 130px #000,inset 0 2px 2px rgba(255,255,255,.18),inset 0 -6px 14px #000,inset 0 0 0 1px rgba(255,255,255,.05)}
.monitor::before{content:"";position:absolute;inset:6px;border-radius:28px;pointer-events:none;z-index:30;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),inset 0 0 26px rgba(0,0,0,.85)}
.chin{position:absolute;left:0;right:0;bottom:0;height:clamp(52px,7vw,86px);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 clamp(20px,4.5vw,56px)}
.tray{width:24%;height:12px;border-radius:2px;position:relative;background:#050608;box-shadow:inset 0 2px 3px #000,0 1px 0 rgba(255,255,255,.12)}
.tray::after{content:"";position:absolute;right:7%;top:4px;width:16%;height:2px;background:#24282f}
.vents{width:16%;height:18px;background:repeating-linear-gradient(90deg,#050608 0 3px,transparent 3px 8px);box-shadow:0 1px 0 rgba(255,255,255,.07)}
.stk{display:flex;gap:8px;width:clamp(44px,7vw,70px)}
.knobs{display:flex;align-items:center;gap:clamp(8px,1.6vw,16px)}
.knob{position:relative;width:clamp(18px,2.4vw,28px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#697686,#272d36 72%);box-shadow:0 3px 5px #000,inset 0 1px 1px rgba(255,255,255,.25)}
.knob::after{content:"";position:absolute;left:50%;top:12%;width:2px;height:34%;margin-left:-1px;background:#07080a;transform:rotate(var(--r,20deg));transform-origin:50% 130%}
.led{width:8px;height:8px;background:var(--blue);box-shadow:0 0 10px var(--blue);animation:pulse 2.8s steps(4) infinite}

/* ───── CRT 화면 ───── */
.crt{position:relative;min-height:var(--h);overflow:hidden;isolation:isolate;background:var(--bg);
  border:2px solid rgba(165,196,225,.22);border-radius:9% / 11%;
  box-shadow:inset 0 0 52px 14px #000,inset 0 0 0 1px rgba(213,233,251,.08),0 0 26px rgba(0,0,0,.7);
  transform:perspective(1050px) rotateX(1.2deg) scale(.99);transform-origin:center 54%}
.crt::before{content:"";position:absolute;inset:0;z-index:25;pointer-events:none;border-radius:inherit;
  background:radial-gradient(ellipse at 50% 48%,transparent 42%,rgba(0,0,0,.06) 54%,rgba(0,0,0,.25) 70%,rgba(0,0,0,.68) 94%,rgba(0,0,0,.92) 118%),
  linear-gradient(90deg,rgba(0,0,0,.5),transparent 22%,transparent 78%,rgba(0,0,0,.5));
  box-shadow:inset 0 0 90px 14px rgba(0,0,0,.65),inset 0 0 3px 1px rgba(216,235,250,.2)}
.crt::after{display:none!important}
.scan,.noise,.band{position:absolute;inset:0;pointer-events:none}
.scan{z-index:22;opacity:.34;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.28) 0 1px,rgba(220,238,255,.05) 2px,transparent 4px);mix-blend-mode:screen}
.noise{z-index:23;opacity:.08;animation:jit .2s steps(2) infinite;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='f'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.83' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23f)'/%3E%3C/svg%3E")}
.band{z-index:40;opacity:0;background:linear-gradient(transparent 43%,rgba(177,210,239,.45) 50%,transparent 57%)}
.content{position:relative;z-index:2;min-height:var(--h);display:flex;flex-direction:column;filter:url(#warp);
  padding:clamp(26px,6%,54px) clamp(26px,7%,80px)}

/* 평평해진 상태(내부 화면) */
body.flat .crt{border-radius:8px;transform:none;box-shadow:inset 0 0 24px rgba(0,0,0,.45)}
body.flat .crt::before{background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.22) 100%);box-shadow:inset 0 0 22px rgba(0,0,0,.25)}
body.flat .crt::after{opacity:.12}
body.flat .scan{opacity:.08}body.flat .noise{opacity:.025}
body.flat .content{filter:none;padding:clamp(18px,3vw,40px) clamp(18px,4vw,56px) 24px}
body.tr .band{animation:band .7s steps(10) both}
body.tr .crt{animation:pull .7s steps(10) both}

.view{display:none;flex:1;flex-direction:column;animation:pop .4s steps(4)}
.view.on{display:flex}

/* ───── 메인(글자 없음, 꾸밈 요소만) ───── */
.stage{position:relative;flex:1;min-height:300px}
.track{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.deco i{position:absolute;width:12px;animation:blink 2.4s steps(2) infinite;opacity:.85}
.corner{position:absolute;width:26px;height:26px;border:0 solid var(--blue);opacity:.45;z-index:3}
.corner.a{left:3%;top:3%;border-width:4px 0 0 4px}.corner.b{right:3%;top:3%;border-width:4px 4px 0 0}
.corner.c{left:3%;bottom:3%;border-width:0 0 4px 4px}.corner.d{right:3%;bottom:3%;border-width:0 4px 4px 0}
.cd{position:absolute;left:0;top:0;width:clamp(88px,19vw,184px);background:none;border:0;padding:0;will-change:transform;touch-action:manipulation}
.cd .disc{position:absolute;left:50%;top:-22%;width:74%;margin-left:-37%;z-index:0;transition:top .3s steps(4)}
.cd.on .disc{top:-48%}
.cd.on .disc svg{animation:spin 2.4s steps(12) infinite}
.cd .face{position:relative;z-index:1;aspect-ratio:1/1;padding:clamp(8px,1.3vw,14px) clamp(8px,1.2vw,13px);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;background:#262b33;border:0}
.cd .face::before{content:"";position:absolute;right:8px;top:8px;width:7px;height:7px;background:var(--c);box-shadow:-4px 4px 0 rgba(255,255,255,.18)}
.cd .face::after{content:"";position:absolute;left:12px;right:8px;top:25px;height:2px;background:var(--c);opacity:.32}
.cd .spine{position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--c)}
.cd .case-top{display:flex;align-items:center;justify-content:flex-start;gap:6px;margin-left:4px;color:var(--c);font-size:clamp(8px,.9vw,10px);line-height:1.3;opacity:.95}
.cd .case-top i{display:inline-block;width:5px;height:5px;background:var(--c);box-shadow:3px 3px 0 rgba(255,255,255,.18)}
.cd .art{display:block;width:42%;max-width:76px;margin:12px auto 2px;opacity:.9}
.cd .case-name{display:block;position:relative;z-index:1;margin:2px 0 1px;text-align:center;color:var(--ink);font-size:clamp(9px,1.1vw,12px);line-height:1.35;overflow-wrap:anywhere}
.cd .case-sticker{position:absolute;right:10px;bottom:12px;width:17px;height:17px;display:block;transform:rotate(7deg);opacity:.9}
.cd .case-sticker svg{width:100%;height:100%}
.cd .dots{display:flex;gap:5px;justify-content:center;margin-top:3px}
.cd .dots i{width:5px;height:5px;background:var(--c);opacity:.9}
.cd.on .face{box-shadow:4px 0 0 var(--c),-4px 0 0 var(--c),0 4px 0 var(--c),0 -4px 0 var(--c),0 0 25px color-mix(in srgb,var(--c) 35%,transparent)}
.selected-label{position:relative;z-index:4;min-height:46px;display:flex;justify-content:center;align-items:center;gap:10px;padding:7px 12px;margin:1px auto 0;max-width:min(420px,100%);color:var(--ink);text-align:left}
.selected-label::before,.selected-label::after{content:"";width:18px;height:4px;background:var(--c,var(--blue));opacity:.8;box-shadow:0 5px 0 color-mix(in srgb,var(--c,var(--blue)) 45%,transparent)}
.selected-label .label-pixel{width:10px;height:10px;background:var(--c,var(--blue));box-shadow:4px 4px 0 rgba(255,255,255,.12);flex:none}
.selected-label .label-copy{display:flex;align-items:baseline;justify-content:center;gap:10px;flex-wrap:wrap}
.selected-label strong{font-family:var(--font-pixel);font-weight:400;font-size:clamp(14px,1.6vw,17px);color:var(--c,var(--blue));line-height:1.5}
.selected-label small{font-family:var(--font-body);font-size:11px;color:var(--dim);line-height:1.5}

.ctrl{position:relative;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px}
.mid{display:flex;align-items:center;gap:clamp(12px,3vw,26px)}
.ib{background:none;border:0;padding:8px;width:34px;opacity:.75;transition:transform .15s steps(2)}
.ib:hover{opacity:1;transform:scale(1.15)}
.run{width:58px;padding:13px 14px 13px 17px;border:0;--c:var(--blue);background:var(--c);margin:4px;
  box-shadow:4px 0 0 var(--c),-4px 0 0 var(--c),0 4px 0 var(--c),0 -4px 0 var(--c),6px 10px 0 #05060a;transition:transform .15s steps(2)}
.run:hover{transform:translate(-2px,-2px)}
.run:active{transform:translate(4px,6px);box-shadow:4px 0 0 var(--c),-4px 0 0 var(--c),0 4px 0 var(--c),0 -4px 0 var(--c)}
.pager{display:flex;gap:7px;position:absolute;left:50%;bottom:-18px;transform:translateX(-50%)}
.pager i{width:7px;height:7px;background:#343943}.pager i.on{background:var(--c,var(--blue))}
.sideL{display:flex;align-items:center;gap:8px;width:90px}
.sideL b{width:9px;height:16px;background:var(--blue);animation:blink 1s steps(2) infinite}
.sideL i{width:5px;height:5px;background:#343943}
.sideR{display:flex;align-items:flex-end;gap:3px;height:18px;width:90px;justify-content:flex-end}
.sideR i{width:5px;background:var(--blue);animation:eq .7s steps(4) infinite alternate}
.sideR i:nth-child(2){animation-delay:-.3s}.sideR i:nth-child(3){animation-delay:-.1s}.sideR i:nth-child(4){animation-delay:-.5s}

/* ───── 내부 화면: 정돈된 빈티지 디지털 아카이브 ───── */
.head{display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;gap:14px;padding:2px 0 18px;border-bottom:1px solid var(--line)}
.head .ic{width:34px;flex:none;opacity:.9}
.head-copy{min-width:0}
.head .eyebrow{display:block;margin-bottom:3px;color:var(--dim);font-size:10px;letter-spacing:.11em;line-height:1.4}
.head h2{margin:0;font-size:clamp(22px,3vw,32px);line-height:1.2;letter-spacing:-.04em;text-shadow:2px 2px 0 #0b0c0f;overflow-wrap:anywhere}
.head p{margin:5px 0 0;color:var(--dim);font-size:12px;line-height:1.55}
.back{background:transparent;border:1px solid #4a515b;padding:9px 12px;color:var(--ink);white-space:nowrap;transition:background .18s,border-color .18s,color .18s;min-height:42px}
.back:hover{background:var(--blue);border-color:var(--blue);color:var(--bg)}
.body{flex:1;min-width:0;padding:clamp(16px,2.6vw,28px) 0 0}
.foot{margin-top:24px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#747c86;font-size:11px;letter-spacing:.02em}
.inner-hero{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:22px;padding:clamp(18px,3vw,30px);margin:0 0 24px;border:1px solid var(--line);background:linear-gradient(115deg,rgba(113,135,155,.09),transparent 58%),#1b1e23;overflow:hidden}
.inner-hero::after{content:"";position:absolute;right:-38px;top:-64px;width:190px;height:190px;border:1px solid rgba(113,135,155,.15);border-radius:50%;box-shadow:0 0 0 18px rgba(113,135,155,.025),0 0 0 38px rgba(113,135,155,.02);pointer-events:none}
.hero-copy{position:relative;z-index:1;min-width:0}
.eyebrow{display:block;color:var(--blue);font-size:10px;letter-spacing:.14em;line-height:1.5;text-transform:uppercase}
.inner-hero h3{font-size:clamp(18px,2.5vw,25px);font-weight:400;line-height:1.35;margin:7px 0 6px;letter-spacing:-.025em;overflow-wrap:anywhere}
.inner-hero p{color:var(--dim);font-size:12px;line-height:1.7;max-width:560px;margin:0}
.hero-mark{position:relative;z-index:1;min-width:78px;text-align:right;border-left:1px solid var(--line);padding-left:18px}
.hero-mark strong{display:block;font-size:clamp(27px,4vw,42px);font-weight:400;color:var(--c,var(--blue));line-height:1}
.hero-mark span{display:block;margin-top:8px;color:var(--dim);font-size:9px;letter-spacing:.12em}
.section-line{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 12px;color:var(--dim);font-size:10px;letter-spacing:.12em}
.section-line strong{font-weight:400;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.plat{position:relative;display:grid;grid-template-columns:30px 46px minmax(0,1fr) auto;gap:12px;align-items:center;min-width:0;min-height:104px;padding:16px 18px;text-decoration:none;background:linear-gradient(145deg,#22262d,#1a1d22);border:1px solid #343a43;transition:transform .2s,border-color .2s,background .2s}
.plat:hover{transform:translateY(-3px);background:#242932;border-color:var(--c)}
.plat:focus-visible{outline:2px dashed var(--c);outline-offset:3px}
.plat-num{align-self:start;padding-top:4px;color:#747d88;font-size:10px;letter-spacing:.08em}
.plat .ic{width:38px;flex:none;padding:7px;background:rgba(255,255,255,.025);border:1px solid #343a43}
.plat .copy{min-width:0}
.plat strong{display:block;font-weight:400;font-size:15px;line-height:1.45;color:var(--c);overflow-wrap:anywhere}
.plat .copy span{display:block;color:var(--dim);font-size:11px;line-height:1.55;margin-top:4px;overflow-wrap:anywhere}
.plat em{display:block;font-style:normal;color:#8e96a0;font-size:10px;letter-spacing:.05em;white-space:nowrap;align-self:end}
.plat em::after{content:' ↗';color:var(--c)}

/* story section: index tabs above a single spacious reading panel */
.story-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.story-item{position:relative;display:grid;grid-template-columns:30px minmax(0,1fr);align-items:start;gap:10px;text-align:left;min-width:0;padding:14px 13px;background:#1b1e23;color:var(--dim);border:1px solid var(--line);transition:border-color .18s,background .18s,color .18s;min-height:82px}
.story-item:hover{border-color:#697b8d;color:var(--ink)}
.story-item.on{border-color:var(--c);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 10%,#1b1e23),#1b1e23);color:var(--ink)}
.story-item .num{color:var(--c);font-size:11px;line-height:1.6}
.story-item strong{display:block;font-size:12px;font-weight:400;color:var(--ink);line-height:1.5;overflow-wrap:anywhere}
.story-item small{display:block;color:var(--dim);font-size:10px;line-height:1.5;margin-top:4px;overflow-wrap:anywhere}
.story-paper{position:relative;min-width:0;padding:clamp(20px,4vw,42px);border:1px solid var(--line);background:linear-gradient(90deg,rgba(113,135,155,.045) 1px,transparent 1px),linear-gradient(#1c1f24,#191c21);background-size:34px 100%,auto;animation:pop .25s steps(4)}
.story-paper::before{content:"";position:absolute;top:0;bottom:0;left:0;width:3px;background:var(--c,var(--blue));opacity:.7}
.story-paper-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:15px;border-bottom:1px solid var(--line)}
.story-paper .tag{color:var(--c);font-size:11px;letter-spacing:.08em}
.story-paper .date{color:var(--dim);font-size:11px}
.story-paper h3{max-width:780px;margin:22px 0 20px;font-size:clamp(23px,4vw,38px);line-height:1.35;letter-spacing:-.04em;font-weight:400;overflow-wrap:anywhere}
.story-copy{max-width:720px;color:#c3c4c1;font-size:13px;line-height:2;word-break:keep-all}
.story-copy p{margin:0 0 18px}
.story-paper-bottom{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:26px;padding-top:12px;border-top:1px dashed #3a414a;color:#727b87;font-size:10px;letter-spacing:.08em}

/* image archive: folder tabs and a calm, consistent tile grid */
.album-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 3px 14px;margin-bottom:18px;border-bottom:1px solid var(--line);scrollbar-width:thin;scrollbar-color:#4a5360 transparent}
.album-tab{flex:none;min-height:42px;padding:9px 13px;color:var(--dim);background:#1b1e23;border:1px solid #343a43;font-size:11px;white-space:nowrap;transition:color .18s,border-color .18s,background .18s}
.album-tab:hover{color:var(--ink);border-color:#677b8e}
.album-tab.on{color:var(--bg);background:var(--blue);border-color:var(--blue)}
.album-tab small{display:inline-block;margin-left:8px;opacity:.7;font-size:10px}
.masonry{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.shot{display:block;position:relative;width:100%;min-width:0;margin:0;padding:0;overflow:hidden;text-align:left;background:#1d2025;border:1px solid #343a43;transition:transform .2s,border-color .2s,background .2s}
.shot:hover{transform:translateY(-3px);border-color:var(--c);background:#23272e}
.shot-visual{display:block;position:relative;background:#171a1f;overflow:hidden}
.shot img{display:block;width:100%;height:auto;aspect-ratio:var(--ratio,4/3);object-fit:cover;transition:transform .35s;filter:saturate(.78)}
.shot:hover img{transform:scale(1.025)}
.shot .ph{display:grid;place-items:center;align-content:center;gap:10px;width:100%;aspect-ratio:var(--ratio,4/3);color:var(--dim);font-size:10px;letter-spacing:.08em;text-align:center;padding:12px;background:linear-gradient(135deg,rgba(113,135,155,.08),transparent 60%),repeating-linear-gradient(135deg,#1c2026 0 12px,#1a1d22 12px 24px)}
.shot .ph svg{width:34px;color:var(--c);opacity:.8}
.shot .ph-label{display:block;line-height:1.6}
.shot-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;background:#20242a;border-top:1px solid #343a43}
.shot .cap{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:#c5c5c0}
.shot-num{flex:none;color:#79828d;font-size:9px;letter-spacing:.06em}

/* ───── 더 단순하고 조금 엉뚱한 내부 화면 ───── */
.head{display:flex;align-items:center;gap:12px;padding:0 0 14px;border-bottom:2px dashed var(--line)}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.plat{position:relative;display:grid;grid-template-columns:24px 36px minmax(0,1fr) auto;gap:10px;align-items:center;min-width:0;min-height:76px;padding:12px 13px;text-decoration:none;background:#242932;border:0;box-shadow:3px 0 0 #101217,-3px 0 0 #101217,0 3px 0 #101217,0 -3px 0 #101217;transition:transform .12s steps(2),background .12s steps(2),box-shadow .12s steps(2)}
.plat:hover{transform:translate(-2px,-2px);background:#303641;box-shadow:3px 0 0 var(--c),-3px 0 0 var(--c),0 3px 0 var(--c),0 -3px 0 var(--c)}

.plat .ic{width:34px;flex:none;padding:4px;background:transparent;border:0}

.story-item:hover{transform:translateY(-2px);color:var(--ink)}
.story-item.on{background:var(--c);color:#20232a;box-shadow:3px 0 0 #101217,-3px 0 0 #101217,0 3px 0 #101217,0 -3px 0 #101217}

.shot{display:block;position:relative;width:100%;min-width:0;margin:0;padding:0;overflow:hidden;text-align:left;background:transparent;border:0;box-shadow:3px 0 0 #101217,-3px 0 0 #101217,0 3px 0 #101217,0 -3px 0 #101217;transition:transform .12s steps(2),box-shadow .12s steps(2)}

/* 모니터와 시디 케이스를 조금 장난감처럼 */
.monitor{border-radius:42px;background:linear-gradient(145deg,#505968 0%,#282d35 25%,#39414d 58%,#171a20 91%);box-shadow:0 40px 110px #000,inset 0 3px 2px rgba(255,255,255,.22),inset 0 -7px 15px #000,inset 0 0 0 2px rgba(255,255,255,.035)}

/* ───── 이번 조정: 가장자리만 남긴 프레임 · 단순한 시디 · 느린 픽셀 조작 ───── */
:root{--h:clamp(500px,calc(100svh - 24px),980px)}
.monitor{
  width:100%;min-height:100svh;margin:0;padding:clamp(6px,.9vw,12px);
  border-radius:0;overflow:hidden;
  background:linear-gradient(135deg,#303743 0%,#171a20 24%,#252b35 66%,#101217 100%);
  box-shadow:inset 0 0 0 clamp(4px,.75vw,9px) #272e38,inset 0 0 0 clamp(7px,1.2vw,14px) #0a0c10;
}
.monitor::before{inset:0;border-radius:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),inset 0 0 0 4px rgba(5,7,10,.7)}
.chin{display:none}
.crt{min-height:var(--h);border-radius:9% / 11%;border-width:2px;}
.content{min-height:var(--h);padding:clamp(20px,4.8vw,50px) clamp(18px,6vw,70px)}
body.flat .content{padding:clamp(18px,3vw,40px) clamp(16px,4vw,54px) 24px}

/* 선택한 이름 외에는 케이스 표면에 장식을 넣지 않아요. */
.cd{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.stage{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.stage.dragging{cursor:grabbing}
.stage.dragging .cd{cursor:grabbing;transition:none}
.cd .face{
  display:grid;place-items:center;aspect-ratio:1/1;min-height:0;
  padding:10px;background:#262c35;border:0;overflow:hidden;
  box-shadow:3px 0 0 #0d1015,-3px 0 0 #0d1015,0 3px 0 #0d1015,0 -3px 0 #0d1015;
  transition:transform .13s steps(2),background .13s steps(2),box-shadow .13s steps(2);
}
.cd .face::before,.cd .face::after{content:none}
.cd .case-name{
  display:block;position:relative;z-index:1;width:100%;margin:0;text-align:center;
  color:var(--ink);font-family:var(--font-pixel);font-size:clamp(12px,1.3vw,15px);
  line-height:1.55;overflow-wrap:anywhere;word-break:keep-all;
}
.cd.on .face{background:#303744;box-shadow:4px 0 0 var(--c),-4px 0 0 var(--c),0 4px 0 var(--c),0 -4px 0 var(--c),0 0 20px color-mix(in srgb,var(--c) 30%,transparent)}
.cd.is-grabbed .face,.stage.dragging .cd.is-grabbed .face{transform:translateY(4px) scale(.975);filter:brightness(1.12)}
.selected-label{min-height:42px;padding:5px 10px}
.selected-label .label-copy{gap:0}
.selected-label strong{font-size:clamp(15px,1.6vw,18px);line-height:1.5}
.selected-label small{display:none}

/* 작은 칸에서도 도트 글자가 뭉개지지 않도록 최소 크기를 올려요. */
.head .eyebrow,.eyebrow{font-size:11px;letter-spacing:0}
.plat-num,.plat em,.story-item .num,.story-paper .tag,.story-paper-bottom,.album-tab,.shot-num{font-size:11px}
.plat .copy span,.story-item small,.shot .cap,.head p,.inner-note,.story-copy{font-size:max(12px, .86em)}
.foot{font-size:11px}

/* 도트 블라인드 전환: 짧고 깨끗하게 닫혔다가 열리며 잔상이 남지 않아요. */
#wipe{position:fixed;inset:0;z-index:110;display:flex;pointer-events:none;overflow:hidden}
#wipe i{display:block;flex:1;min-width:0;background:#1b1e24;border:0;box-shadow:none!important;transform:scaleY(0);transform-origin:top;will-change:transform}
#wipe.in i{animation:wipeIn .28s steps(4) forwards}
#wipe.out i{transform:scaleY(1);transform-origin:bottom;animation:wipeOut .28s steps(4) forwards}
@keyframes wipeIn{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes wipeOut{from{transform:scaleY(1)}to{transform:scaleY(0)}}
@media(max-width:900px){
  .monitor{width:100%;margin:0;padding:8px;border-radius:0}
  .monitor::before{inset:0;border-radius:0}

/* src 에 이미지 주소를 넣으면 그림이 나오고, 비워두면 빈 액자. w·h 는 빈 액자의 가로세로 비율 */

/* 메인 시디 3장 (메인에는 글자가 안 보이고, 이름은 내부 화면 제목으로만 쓰여요) */
const DISCS = [
  { id:'plat',  name:'사용 플랫폼', c:'#8cc4f0', hint:'자주 가는 곳 모아 두기', icon:'win' },
  { id:'story', name:'사담',       c:'#f3d27a', hint:'별말 아닌 이야기들', icon:'bubble' },

];
const STEP = 40; /* 시디 사이의 각도 */

/* ================================================================
   아래는 동작 코드
   ================================================================ */
const $ = s => document.querySelector(s), body = document.body, INK = '#eee9dd', BG = '#1b1e24';
const COLORS = ['#8cc4f0','#f3d27a','#f0a3b6','#93d6b4'];

/* 도트 그림 */
function spr(rows,pal){
  const h = rows.length, w = rows[0].length; let r = '';
  rows.forEach((row,y)=>[...row].forEach((ch,x)=>{ if(pal[ch]) r += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${pal[ch]}"/>`; }));
  return `<svg viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
}
const ICONS = {
  win:['kkkkkkkkkkkk','kakakk....kk','kkkkkkkkkkkk','k..........k','k.aaaa.bbb.k','k..........k','k.aaaaaaa..k','k..........k','k.bbb.aaaa.k','kkkkkkkkkkkk'],
  bubble:['.kkkkkkkkkk.','kk........kk','k.aaaaaaaa.k','k..........k','k.aaaaaa...k','kk........kk','.kkkkkkkkkk.','...kk.......','....k.......'],
  photo:['kkkkkkkkkkkk','k..........k','k.....bb...k','k.....bb...k','k..a.......k','k.aaa..aa..k','kaaaaa.aaaak','kkkkkkkkkkkk'],
  heart:['.kk.kk.','kkkkkkk','kkkkkkk','.kkkkk.','..kkk..','...k...'],
  star:['...k...','...k...','..kkk..','kkkkkkk','..kkk..','.kk.kk.','kk...kk'],
  plus:['..k..','..k..','kkkkk','..k..','..k..'],
  play:['k......','kk.....','kkk....','kkkk...','kkkkk..','kkkk...','kkk....','kk.....','k......'],
  left:['....k','...kk','..kkk','.kkkk','kkkkk','.kkkk','..kkk','...kk','....k'],
  right:['k....','kk...','kkk..','kkkk.','kkkkk','kkkk.','kkk..','kk...','k....'],
  sun:['....k....','.k..k..k.','..kkkkk..','..kkkkk..','kkkkkkkkk','..kkkkk..','..kkkkk..','.k..k..k.','....k....'],
  moon:['..kkkk..','.kkk....','kkk.....','kkk.....','kkk.....','kkk.....','.kkk....','..kkkk..'],
};
const icon = (n,c,a=INK,b='#fff') => spr(ICONS[n],{k:c,a:a,b:b});
function disc(c,k){
  let r = '';
  const deco = {
    plat:'<path d="M80 7v146M7 80h146" stroke="#fff" stroke-width="2" opacity=".28"/>',
    story:'<path d="M80 34l8 17 18 2-13 12 4 18-17-10-17 10 4-18-13-12 18-2z" fill="#fff" opacity=".4"/>',
    cut:'<path d="M80 7a73 73 0 0 1 0 146z" fill="#fff" opacity=".22"/>'
  }[k] || '';
  /* 오프센터 반사 조각과 홈이 있어 원판이 도는 것이 잘 보이게 */
  for(let i=0;i<24;i++){
    const a=(i/24)*Math.PI*2, x=80+Math.cos(a)*58, y=80+Math.sin(a)*58;
    r += `<rect x="${(x-2.5).toFixed(1)}" y="${(y-1.5).toFixed(1)}" width="5" height="3" fill="${i%3===0?'#f0e8cf':c}" opacity="${i%3===0?'.68':'.36'}" transform="rotate(${i*15} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;
  }
  return `<svg viewBox="0 0 160 160" shape-rendering="crispEdges" aria-hidden="true">
    <circle cx="80" cy="80" r="77" fill="#8995a2" stroke="#e6e7e2" stroke-width="2"/>
    <circle cx="80" cy="80" r="73" fill="${c}" stroke="#64717e" stroke-width="1.5"/>
    <circle cx="80" cy="80" r="66" fill="none" stroke="#f2eee2" stroke-width="2" opacity=".46"/>
    <circle cx="80" cy="80" r="57" fill="none" stroke="#44515d" stroke-width="2" opacity=".44"/>
    <circle cx="80" cy="80" r="48" fill="none" stroke="#f1ead8" stroke-width="1.5" opacity=".5"/>
    <circle cx="80" cy="80" r="39" fill="none" stroke="#56626c" stroke-width="2" opacity=".55"/>
    <path d="M27 45 L46 26 L57 31 L36 52 Z" fill="#f3edda" opacity=".42"/>
    ${r}
    ${deco}
    <circle cx="80" cy="80" r="19" fill="#d0d4d4" stroke="#697580" stroke-width="3"/>
    <circle cx="80" cy="80" r="12" fill="#747f89" stroke="#ece9df" stroke-width="2"/>
    <circle cx="80" cy="80" r="5" fill="#293039"/>
  </svg>`;
}

/* ── 곡면 렌즈: 왜곡 지도를 직접 만들어서 CRT처럼 가운데를 볼록하게 ── */
const warpImg = $('#warpImg'), warpMap = $('#warpMap'), content = $('#content');
(function(){
  try{
    const N = 128, cv = document.createElement('canvas'); cv.width = cv.height = N;
    const cx = cv.getContext('2d'), im = cx.createImageData(N,N);
    for(let y=0;y<N;y++) for(let x=0;x<N;x++){
      const u = x/(N-1)*2-1, v = y/(N-1)*2-1, r2 = u*u+v*v, i = (y*N+x)*4;
      im.data[i]   = Math.max(0,Math.min(255,Math.round((.5+.5*u*(r2-1))*255)));
      im.data[i+1] = Math.max(0,Math.min(255,Math.round((.5+.5*v*(r2-1))*255)));
      im.data[i+2] = 128; im.data[i+3] = 255;
    }
    cx.putImageData(im,0,0);
    warpImg.setAttribute('href',cv.toDataURL());
  }catch(e){ content.style.filter = 'none'; }
})();
const K = 0.09; /* 곡면 세기 (0.08 약하게 ~ 0.2 강하게) */
function fitWarp(){
  const w = content.offsetWidth, h = content.offsetHeight; if(!w) return;
  warpImg.setAttribute('width',w); warpImg.setAttribute('height',h);
  warpMap.setAttribute('scale',(K/(1+K))*((w+h)/2));
}
new ResizeObserver(fitWarp).observe(content); fitWarp();

/* 장식 */
$('#prev').innerHTML = icon('left',INK); $('#next').innerHTML = icon('right',INK);
$('#deco').innerHTML = Array.from({length:12},(_,i)=>`<i style="left:${(Math.random()*92+2)|0}%;top:${(Math.random()*90+2)|0}%;width:${8+(Math.random()*8|0)}px;animation-delay:${(-Math.random()*3).toFixed(1)}s;animation-duration:${(1.6+Math.random()*2.4).toFixed(1)}s">${icon('plus',COLORS[i%4])}</i>`).join('');
const cursorAssets=(()=>{
  const arrow=`<svg xmlns='http://www.w3.org/2000/svg' width='16' height='20' viewBox='0 0 16 20'><path d='M1 1h2v2h2v2h2v2h2v2h2v2h2v2h-2v2h-2v2H7v-2H5v-2H3V9H1z' fill='#eee9dd' stroke='#15181e' stroke-width='1.5' shape-rendering='crispEdges'/></svg>`;
  const hand=`<svg xmlns='http://www.w3.org/2000/svg' width='20' height='22' viewBox='0 0 20 22'><path d='M7 2h3v7h2V5h3v4h2v5l-3 6H7l-4-6V9h3v3h1z' fill='#eee9dd' stroke='#15181e' stroke-width='1.5' shape-rendering='crispEdges'/></svg>`;
  const arrowUrl=`url("data:image/svg+xml,${encodeURIComponent(arrow)}") 0 0, auto`;
  const handUrl=`url("data:image/svg+xml,${encodeURIComponent(hand)}") 4 2, pointer`;
  body.style.cursor=arrowUrl;
  document.documentElement.style.setProperty('--pixel-pointer',handUrl);
  return {arrowUrl,handUrl};
})();
let lastT=0, ci=0;
addEventListener('mousemove',e=>{
  const n=performance.now(); if(n-lastT<70) return; lastT=n;
  const t=document.createElement('i'); t.className='trail';
  t.style.left=e.clientX+'px'; t.style.top=e.clientY+'px'; t.style.background=COLORS[ci++%4];
  t.style.setProperty('--dx',(Math.random()*20-10)+'px'); t.style.setProperty('--dy',(Math.random()*20+4)+'px');
  body.appendChild(t); setTimeout(()=>t.remove(),520);
},{passive:true});
const toastEl=$('#toast');
function toast(m){ toastEl.textContent=m; toastEl.classList.remove('on'); void toastEl.offsetWidth; toastEl.classList.add('on'); }

/* ── 시디 바퀴: 화면 밖 아래쪽의 한 점을 중심으로 원을 그리며 돌아요 ── */
const stage=$('#stage'), track=$('#track'), N=DISCS.length;
const cds = DISCS.map((d,i)=>{
  const b=document.createElement('button'); b.className='cd'; b.dataset.id=d.id; b.style.setProperty('--c',d.c); b.setAttribute('aria-label',d.name+' 시디 선택');
  b.innerHTML=`<span class="face"><span class="pat"></span><span class="disc">${disc(d.c,d.id)}</span><span class="case-name">${d.name}</span></span>`;
  b.addEventListener('click',e=>{
    if(performance.now()<suppressClickUntil){ e.preventDefault(); return; }
    const current=((Math.round(target)%N)+N)%N;
    const step=Math.round(norm(i-current));
    /* 시디는 고르기만 하고, 들어갈 때는 가운데 재생 버튼을 눌러요. */
    if(step!==0) rotate(step);
  });
  stage.appendChild(b); return b;
});
$('#pager').innerHTML=DISCS.map(()=>'<i></i>').join('');
const pagerDots=[...$('#pager').children];
let pos=0, target=0, sel=0, W=0, H=0, R=0, cy=0, raf=0, where='home', busy=false;
const norm = v => (((v%N)+N*1.5)%N)-N/2;       /* -1.5 ~ 1.5 로 접기 */
function layout(){
  W=stage.clientWidth; H=stage.clientHeight; if(!W) return;
  R=W<560?W*.48:Math.max(W*.62,230); cy=H*.5;
  const py=cy+R; /* 화면 아래로 벗어난 회전 중심점 */
  track.setAttribute('viewBox',`0 0 ${W} ${H}`);
  track.innerHTML=`<g id="tg">`+[R-92,R,R+92].map((r,k)=>`<circle cx="${W/2}" cy="${py}" r="${r}" fill="none" stroke="${COLORS[k===1?0:k===0?1:2]}" stroke-width="4" stroke-dasharray="4 ${k===1?14:22}" opacity="${k===1?.4:.22}" shape-rendering="crispEdges"/>`).join('')+`</g>`;
  draw();
}
function draw(){
  if(!W) return; const py=cy+R;
  cds.forEach((el,i)=>{
    const d=norm(i-pos), a=d*STEP*Math.PI/180, ad=Math.abs(d);
    const x=Math.round((W/2+R*Math.sin(a))/4)*4, y=Math.round((py-R*Math.cos(a))/4)*4;
    el.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%) scale(${(1-.12*Math.min(ad,1.3)).toFixed(3)})`;
    el.style.opacity=ad<1?1:Math.max(0,1-(ad-1)*3);
    el.style.zIndex=10-Math.round(ad*4);
    el.style.filter=`brightness(${(1-.2*Math.min(ad,1)).toFixed(2)})`;
    el.classList.toggle('on',ad<.5);
  });
  const g=$('#tg'); if(g) g.setAttribute('transform',`rotate(${-pos*STEP} ${W/2} ${py})`);
}
function syncSelection(index){
  sel=((index%N)+N)%N;
  const chosen=DISCS[sel], c=chosen.c;
  $('#run').style.setProperty('--c',c); $('#run').innerHTML=icon('play',BG);
  $('#pager').style.setProperty('--c',c);
  $('#selectedLabel').style.setProperty('--c',c);
  $('#selectedName').textContent=chosen.name;
  pagerDots.forEach((p,k)=>p.classList.toggle('on',k===sel));
}
let lastTick=0;
function tick(now=0){
  /* 작은 간격으로 한 칸씩 끊어 움직이는 느린 도트식 이동 */
  if(now-lastTick<42){ raf=requestAnimationFrame(tick); return; }
  lastTick=now;
  const diff=target-pos;
  const jump=Math.sign(diff)*Math.min(Math.abs(diff),0.052);
  pos+=jump;
  if(Math.abs(target-pos)<0.006){ pos=target; raf=0; draw(); return; }
  draw(); raf=requestAnimationFrame(tick);
}
function rotate(n){
  target+=n;
  syncSelection(Math.round(target));
  if(!raf) raf=requestAnimationFrame(tick);
}
new ResizeObserver(layout).observe(stage);
syncSelection(0); draw();
$('#prev').addEventListener('click',()=>rotate(-1));
$('#next').addEventListener('click',()=>rotate(1));
$('#run').addEventListener('click',()=>go(DISCS[sel].id));

/* 시디 옆을 누르면 선택되고, 잡아 끌면 바퀴가 따라 움직여요. */
let drag=null, suppressClickUntil=0;
function finishDrag(e){
  if(!drag || (e && e.pointerId!==drag.pointerId)) return;
  const finished=drag;
  if(finished.card) finished.card.classList.remove('is-grabbed');
  stage.classList.remove('dragging');
  if(finished.moved){
    suppressClickUntil=performance.now()+420;
    target=Math.round(pos);
    syncSelection(target);
    if(!raf) raf=requestAnimationFrame(tick);
  }
  drag=null;
}
stage.addEventListener('pointerdown',e=>{
  if(where!=='home'||busy||e.button>0) return;
  drag={pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,startPos:pos,moved:false,captured:false,card:e.target.closest('.cd')};
});
stage.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pointerId) return;
  const dx=e.clientX-drag.startX, dy=e.clientY-drag.startY;
  if(!drag.moved && Math.abs(dx)>7 && Math.abs(dx)>Math.abs(dy)*.75){
    drag.moved=true;
    stage.classList.add('dragging');
    if(drag.card) drag.card.classList.add('is-grabbed');
    try{stage.setPointerCapture(e.pointerId);drag.captured=true;}catch(_){ }
  }
  if(!drag.moved) return;
  e.preventDefault();
  const unit=Math.max(90,R*Math.sin(STEP*Math.PI/180));
  pos=drag.startPos-dx/unit;
  target=pos;
  const next=((Math.round(pos)%N)+N)%N;
  if(next!==sel) syncSelection(next);
  draw();
},{passive:false});
stage.addEventListener('pointerup',finishDrag);
stage.addEventListener('pointercancel',finishDrag);
stage.addEventListener('lostpointercapture',finishDrag);
addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if($('#lb').classList.contains('on')) $('#lb').classList.remove('on'); else if(where!=='home') go('home'); return; }
  if(where!=='home') return;
  if(e.key==='ArrowLeft') rotate(-1);
  if(e.key==='ArrowRight') rotate(1);
  if(e.key==='Enter' && document.activeElement.tagName!=='A') go(DISCS[sel].id);
});

/* ── 화면 전환: 첨부 예시의 도트 블라인드 효과만 가져왔어요. ── */
const wipe=$('#wipe');
wipe.innerHTML='<i></i>'.repeat(16);
[...wipe.children].forEach((tile,i)=>{ tile.style.animationDelay=(i*6)+'ms'; });
function go(id){
  if(busy||id===where) return;
  busy=true;
  wipe.className='';
  void wipe.offsetWidth;
  wipe.className='in';
  /* 픽셀 커튼이 화면을 덮는 순간 내용을 바꾸고 바로 걷어내요. */
  setTimeout(()=>{
    where=id;
    render(id);
    body.classList.toggle('flat',id!=='home'); body.dataset.v=id;
    scrollTo(0,0);
    if(id==='home') requestAnimationFrame(layout);
    wipe.className='';
    void wipe.offsetWidth;
    wipe.className='out';
    setTimeout(()=>{
      wipe.className='';
      busy=false;
    },390);
  },390);
}

/* ── 내부 화면 ── */
function header(d,sub){
  $('#head').innerHTML=`<span class="ic">${disc(d.c)}</span><div class="head-copy"><h2 style="color:${d.c}">${d.name}</h2><p>${sub}</p></div><button class="back" id="back">← 돌아가기</button>`;
  $('#back').addEventListener('click',()=>go('home'));
}
function hero(kicker,title,desc,count,label,c){
  return `<section class="inner-hero" style="--c:${c}"><div class="hero-copy"><span class="eyebrow">${kicker}</span><h3>${title}</h3><p>${desc}</p></div><div class="hero-mark"><strong>${count}</strong><span>${label}</span></div></section>`;
}
function render(id){
  $('#v-home').classList.toggle('on',id==='home');
  $('#v-inner').classList.toggle('on',id!=='home');
  if(id==='home') return;
  const d=DISCS.find(x=>x.id===id), box=$('#inner');
  if(!d) return;
  box.style.setProperty('--c',d.c);

  if(id==='plat'){
    header(d,'자주 가는 곳을 모아 뒀어요.');
    box.innerHTML=`<div class="grid">`+PLATFORMS.map((p,i)=>{
      const c=COLORS[i%3];
      return `<a class="plat" style="--c:${c}" href="${p.url}" target="_blank" rel="noopener" data-u="${p.url}"><span class="ic">${icon('win',c)}</span><div class="copy"><strong>${p.name}</strong><span>${p.desc}</span></div><em>열기</em></a>`;
    }).join('')+`</div>`;
    box.querySelectorAll('.plat').forEach(a=>a.addEventListener('click',e=>{
      if(a.dataset.u==='#'){e.preventDefault();toast('아직 비어 있어요. 주소를 넣어 주세요!');}
    }));
    $('#footL').textContent='바로가기 모음';

  } else if(id==='story'){
    header(d,'왼쪽에서 글을 골라 읽어 보세요.');
    box.innerHTML=`<div class="story-layout"><nav class="story-list" aria-label="사담 제목">`+
      STORIES.map((item,i)=>`<button class="story-item" data-i="${i}" style="--c:${d.c}"><strong>${item.title}</strong><small>${item.who}</small></button>`).join('')+
      `</nav><article class="story-paper" id="post" style="--c:${d.c}"></article></div>`;
    const show=i=>{
      const item=STORIES[i];
      box.querySelectorAll('.story-item').forEach((b,k)=>b.classList.toggle('on',k===i));
      const post=$('#post');
      post.innerHTML=`<div class="story-post-tools"><span class="date">${item.date}</span></div><h3>${item.title}</h3><div class="story-copy">${item.body.map(t=>`<p>${t}</p>`).join('')}</div>`;
    };
    box.querySelectorAll('.story-item').forEach(b=>b.addEventListener('click',()=>show(+b.dataset.i)));
    show(0); $('#footL').textContent='사담';

  } else if(id==='cut'){
    header(d,'가로 그림과 세로 그림을 나눠 모아 뒀어요.');
    box.innerHTML=`<nav class="album-tabs" aria-label="이미지 폴더">`+
      ALBUMS.map((a,i)=>`<button class="album-tab" data-i="${i}">${a.name}</button>`).join('')+
      `</nav><div id="gallery"></div>`;
    const show=i=>{
      const album=ALBUMS[i];
      box.querySelectorAll('.album-tab').forEach((b,k)=>b.classList.toggle('on',k===i));
      const groups=[
        {key:'landscape',title:'가로 그림',items:album.items.filter(m=>(m.w||4)>(m.h||3)),ratio:'4 / 3'},
        {key:'portrait',title:'세로 그림',items:album.items.filter(m=>(m.w||4)<(m.h||3)),ratio:'3 / 4'},
        {key:'square',title:'정사각 그림',items:album.items.filter(m=>(m.w||4)===(m.h||3)),ratio:'1 / 1'}
      ].filter(g=>g.items.length);
      $('#gallery').innerHTML=groups.map(group=>`<section class="gallery-group"><h3 class="gallery-heading">${group.title}<span>${group.items.length}장</span></h3><div class="gallery-grid ${group.key}">`+
        group.items.map(m=>{
          const c=COLORS[album.items.indexOf(m)%3];
          const inner=m.src?`<img src="${m.src}" alt="${m.cap||''}" loading="lazy">`:`<span class="ph" style="--c:${c}"><span class="ph-icon">${icon('photo',c)}</span><span class="ph-label">그림 넣기</span></span>`;
          return `<button class="shot" style="--c:${c};--ratio:${group.ratio}" data-s="${m.src}" data-c="${m.cap||''}"><span class="shot-visual">${inner}</span><span class="shot-meta"><span class="cap">${m.cap||'이름 없는 그림'}</span></span></button>`;
        }).join('')+`</div></section>`).join('');
      box.querySelectorAll('.shot').forEach(sh=>sh.addEventListener('click',()=>{
        if(!sh.dataset.s){toast('여기에 이미지를 넣을 수 있어요.');return;}
        $('#lb img').src=sh.dataset.s; $('#lb p').textContent=sh.dataset.c; $('#lb').classList.add('on');
      }));
    };
    box.querySelectorAll('.album-tab').forEach(b=>b.addEventListener('click',()=>show(+b.dataset.i)));
    show(0); $('#footL').textContent='이미지 보관함';
  }
}
function setTheme(mode){
  const light=mode==='light';
  body.classList.toggle('light-mode',light);
  $('#themeDark').classList.toggle('on',!light);
  $('#themeLight').classList.toggle('on',light);
  $('#themeDark').setAttribute('aria-pressed',String(!light));
  $('#themeLight').setAttribute('aria-pressed',String(light));
  $('#themeDark').setAttribute('aria-label',light?'어두운 화면으로 전환':'어두운 화면');
  $('#themeLight').setAttribute('aria-label',light?'밝은 화면':'밝은 화면으로 전환');
}
$('#themeLight').innerHTML=icon('sun','currentColor');
$('#themeDark').innerHTML=icon('moon','currentColor');
$('#themeDark').addEventListener('click',()=>setTheme('dark'));
$('#themeLight').addEventListener('click',()=>setTheme('light'));

$('#lb').addEventListener('click',()=>$('#lb').classList.remove('on'));
</script>
</body>
</html>
