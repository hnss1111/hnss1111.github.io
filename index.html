<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도트 게임기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
:root{--px:'Galmuri11','Galmuri9','DotGothic16','Malgun Gothic','Apple SD Gothic Neo',sans-serif;--bd2:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100svh;display:grid;place-items:center;padding:14px;font-family:var(--bd2);color:#394150;background:#1b2130}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
svg{display:block;width:100%;height:auto;image-rendering:pixelated}
:focus-visible{outline:2px dashed #394150;outline-offset:3px}

/* ── 게임기 본체: 가운데 화면 ── */
.console{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:0;width:min(1120px,100%)}
.bezel{position:relative;flex:1;width:100%;min-width:0;background:#2a3142;padding:clamp(8px,1.3vw,14px);padding-bottom:clamp(8px,1.3vw,14px);border-radius:22px;box-shadow:inset 0 0 0 3px #1a2030}
/* 밝은/어두운 화면 스위치: 게임기 테두리와 곡률 영역에서 완전히 분리해 아래쪽 바깥에 배치합니다. */
.tgbar{position:relative;z-index:60;align-self:flex-end;right:auto;bottom:auto;height:auto;display:flex;align-items:center;justify-content:flex-end;gap:8px;width:max-content;margin-top:14px;margin-right:4px;pointer-events:auto}
.tgbar button{position:relative;top:auto;left:auto;right:auto;flex:0 0 auto;width:32px;height:32px;display:grid;place-items:center;color:#8fa0b8;opacity:.9;background:#1f2638;box-shadow:2px 0 0 #0f1422,-2px 0 0 #0f1422,0 2px 0 #0f1422,0 -2px 0 #0f1422;pointer-events:auto;touch-action:manipulation}
.tgbar button svg{width:16px}
.tgbar button.on{background:#c9d4e2;color:#1a2030;opacity:1}
.night-mode .tgbar button{background:#202838;color:#AFC1D8;box-shadow:2px 0 0 #121A27,-2px 0 0 #121A27,0 2px 0 #121A27,0 -2px 0 #121A27}
.night-mode .tgbar button.on{background:#9BC4E8;color:#202838;opacity:1}

/* ── 화면 ── */
.screen{--bg:#dde4ea;--ink:#2f3a4a;--dim:#66737f;--panel:#eef1f3;--bd:#2f3a4a;--shade:#cdd6dd;--dot:#a9b6c3;--b1:#b4c6dc;--b2:#c1d0e2;--b3:#cedae7;--b4:#dbe3ed;--b5:#e8edf2;position:relative;height:clamp(500px,78vh,700px);display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--ink)}
.screen.night{--bg:#202838;--ink:#F0EEE8;--dim:#B2BDCD;--panel:#2B3547;--bd:#141C2A;--shade:#3A465B;--dot:#68788E;--b1:#202B3D;--b2:#253147;--b3:#2C384C;--b4:#324057;--b5:#252F42}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:30;background:repeating-linear-gradient(transparent 0 3px,rgba(0,0,0,.035) 3px 4px)}
.frame{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg);border-radius:14px}
.frame.hm{background:var(--b5)}
.scene{flex:1;min-height:0;overflow-y:auto;padding:clamp(14px,3vw,28px);display:flex;flex-direction:column;scrollbar-width:thin}
.hint{flex:none;display:flex;align-items:center;justify-content:center;min-height:34px;padding:7px 14px;border-top:3px solid var(--bd);background:var(--panel);font-family:var(--px);font-size:11px;color:var(--dim);text-align:center}
.win{background:var(--panel);box-shadow:3px 0 0 var(--bd),-3px 0 0 var(--bd),0 3px 0 var(--bd),0 -3px 0 var(--bd),inset 0 0 0 3px var(--shade);padding:16px 18px}

/* 홈: 게임 고르기 */
.scene.home{position:relative;overflow:hidden}
.deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;background-color:var(--b5);
  /* 배경 격자는 원래처럼 일정하게 이동하되, 선과 배경의 대비를 낮춰 장식 뒤로 물립니다. */
  background-image:
    linear-gradient(90deg,color-mix(in srgb,var(--dot) 24%,transparent) 0 1px,transparent 1px 100%),
    linear-gradient(0deg,color-mix(in srgb,var(--dot) 24%,transparent) 0 1px,transparent 1px 100%);
  background-size:48px 48px,48px 48px;
  background-position:0 0,0 0;
  animation:gm 12s steps(8) infinite}
@keyframes gm{to{background-position:48px 48px,48px 48px}}
/* 상단의 긴 삼색 띠 대신, 리듬 표시처럼 짧게 어긋난 세 개의 막대 */
.deco::after{content:"";position:absolute;top:24px;right:clamp(18px,4vw,44px);width:34px;height:4px;background:var(--g1);box-shadow:-11px 8px 0 var(--g2),-22px 16px 0 var(--g3);opacity:.22;transform:rotate(-12deg);animation:accentBeat 7.2s steps(1,end) infinite}
@keyframes accentBeat{0%,83%,100%{opacity:.16;transform:translateY(0) rotate(-12deg)}86%{opacity:.28;transform:translateY(-3px) rotate(-12deg)}89%{opacity:.16;transform:translateY(0) rotate(-12deg)}}
.deco .sh{position:absolute;bottom:-80px;color:var(--c);opacity:.43;animation-name:float;animation-timing-function:steps(30);animation-iteration-count:infinite}
.deco .sh svg{width:100%;height:auto;overflow:visible}
.screen.night .deco .sh{opacity:.58}
.deco .sh .form{opacity:0;animation-duration:var(--swap-duration,9s);animation-delay:var(--swap-delay,0s);animation-timing-function:steps(1,end);animation-iteration-count:infinite}
.deco .sh .form-a{animation-name:formA}
.deco .sh .form-b{animation-name:formB}
.deco .sh .form-c{animation-name:formC}
@keyframes formA{0%,32%{opacity:1}33%,100%{opacity:0}}
@keyframes formB{0%,32%{opacity:0}33%,65%{opacity:1}66%,100%{opacity:0}}
@keyframes formC{0%,65%{opacity:0}66%,100%{opacity:1}}
@keyframes float{0%{transform:translate(0,0)}25%{transform:translate(14px,-225px)}50%{transform:translate(-10px,-450px)}75%{transform:translate(12px,-675px)}100%{transform:translate(0,-900px)}}
.stage{position:relative;flex:1;min-height:270px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.stage.dragging{cursor:grabbing}
.track{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}

/* ── 투명 앨범 케이스 (가로로 살짝 긴 1:1 느낌) + 오른쪽 끝 연결부에서 CD가 나와요 ── */
.cd{position:absolute;left:0;top:0;width:clamp(104px,22vw,186px);will-change:transform;touch-action:none;cursor:pointer}
.cs{position:relative;display:block;aspect-ratio:9/8;--edge:color-mix(in srgb,var(--ink) 60%,transparent)}
.disc{position:absolute;right:-15%;top:9%;width:74%;z-index:1;transition:transform .3s steps(4)}
.cd.on .disc{transform:translateX(26%)}
.cd.on .disc svg{animation:spin 4.2s steps(24) infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.cf{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 30%,transparent),color-mix(in srgb,var(--c) 10%,transparent) 60%,color-mix(in srgb,var(--c) 22%,transparent));box-shadow:3px 0 0 var(--edge),-3px 0 0 var(--edge),0 3px 0 var(--edge),0 -3px 0 var(--edge),inset 3px 3px 0 rgba(255,255,255,.45),inset -3px -3px 0 rgba(0,0,0,.14)}
.cf::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 22%,rgba(255,255,255,.34) 22% 29%,transparent 29% 36%,rgba(255,255,255,.2) 36% 39%,transparent 39%)}
.c-bk{position:absolute;left:6%;top:9%;width:70%;bottom:9%;background:var(--tint);box-shadow:0 0 0 3px #f7f2e6}
.c-lab{position:absolute;left:7%;top:8%;width:86%;aspect-ratio:20/16;overflow:hidden;background:var(--tint);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 55%,#2a3142)}
.c-lab svg{width:100%;height:100%}
.c-dots{position:absolute;left:7%;bottom:9%;display:flex;gap:5px}
.c-dots i{width:7px;height:7px}
.c-hg{position:absolute;right:0;top:0;bottom:0;width:13%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12%;background:color-mix(in srgb,var(--c) 60%,#2a3142);box-shadow:inset 3px 0 0 rgba(0,0,0,.28),inset 6px 0 0 rgba(255,255,255,.14)}
.c-hg i{width:34%;aspect-ratio:1;background:#f7f2e6;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.cd.on .cf{box-shadow:4px 0 0 var(--c),-4px 0 0 var(--c),0 4px 0 var(--c),0 -4px 0 var(--c),inset 3px 3px 0 rgba(255,255,255,.5),0 0 16px color-mix(in srgb,var(--c) 40%,transparent)}
.cn{display:block;width:max-content;max-width:100%;margin:14px auto 0;padding:3px 9px;background:var(--panel);color:var(--ink);font-family:var(--px);font-size:clamp(11px,1.25vw,14px);line-height:1.4;word-break:keep-all;box-shadow:3px 0 0 var(--bd),-3px 0 0 var(--bd),0 3px 0 var(--bd),0 -3px 0 var(--bd)}
.cd.on .cn{box-shadow:3px 0 0 var(--c),-3px 0 0 var(--c),0 3px 0 var(--c),0 -3px 0 var(--c)}
.bk{margin-left:auto;padding:6px 10px;background:var(--shade);color:var(--ink);font-family:var(--px);font-size:11px}
.bk:hover{background:var(--c)}
.gh .bk~.bk{margin-left:0}
/* 설명 바: 화면 전체와 같이 곡면 왜곡을 받아요 */
.sayw{flex:none;padding:0 clamp(14px,3vw,28px) 18px}
.say{margin:0 auto;width:min(520px,100%);text-align:center;font-size:13px;line-height:1.7}
.say em{display:block;margin-top:4px;font-family:var(--px);font-style:normal;font-size:11px;color:var(--dim);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}

/* 게임마다 다른 배경 */
.g-plat{background:conic-gradient(color-mix(in srgb,var(--c) 22%,var(--bg)) 25%,color-mix(in srgb,var(--c) 10%,var(--bg)) 0 50%,color-mix(in srgb,var(--c) 22%,var(--bg)) 0 75%,color-mix(in srgb,var(--c) 10%,var(--bg)) 0) 0 0/48px 48px;animation:slide 6s steps(24) infinite}
@keyframes slide{to{background-position:0 0,48px 48px}}
.screen.night .g-plat{background:conic-gradient(color-mix(in srgb,var(--c) 14%,var(--bg)) 25%,color-mix(in srgb,var(--c) 7%,var(--bg)) 0 50%,color-mix(in srgb,var(--c) 14%,var(--bg)) 0 75%,color-mix(in srgb,var(--c) 7%,var(--bg)) 0) 0 0/48px 48px;animation:slide 6s steps(24) infinite}
.g-story{background:#f5ebd3}
.screen.night .g-story{background:#2E2E3D}
.g-cut{background:linear-gradient(transparent 0 8px,var(--bg) 8px 20px,transparent 20px) 6px 0/10px 28px repeat-y,linear-gradient(transparent 0 8px,var(--bg) 8px 20px,transparent 20px) calc(100% - 6px) 0/10px 28px repeat-y,linear-gradient(90deg,#2a3142 0 22px,transparent 22px calc(100% - 22px),#2a3142 0),color-mix(in srgb,var(--c) 14%,var(--bg));animation:film 3.5s steps(7) infinite}
.screen.night .g-cut{background:linear-gradient(transparent 0 8px,var(--bg) 8px 20px,transparent 20px) 6px 0/10px 28px repeat-y,linear-gradient(transparent 0 8px,var(--bg) 8px 20px,transparent 20px) calc(100% - 6px) 0/10px 28px repeat-y,linear-gradient(90deg,#141C2A 0 22px,transparent 22px calc(100% - 22px),#141C2A 0),color-mix(in srgb,var(--c) 12%,var(--bg));animation:film 3.5s steps(7) infinite}
@keyframes film{to{background-position:6px 28px,calc(100% - 6px) 28px,0 0}}
.scene.g-cut{padding-left:46px;padding-right:46px}
.gh{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-family:var(--px);font-size:clamp(17px,2.4vw,22px);color:var(--c)}
.gh svg{width:28px;flex:none}

/* 사용 플랫폼: RPG 메뉴 */
.rpg{display:grid;grid-template-columns:minmax(210px,.82fr) minmax(0,1.18fr);gap:clamp(14px,2.4vw,26px);align-items:stretch}
.menu{display:flex;flex-direction:column;gap:0;padding:8px}
.mi{display:flex;align-items:center;gap:11px;text-align:left;min-height:48px;padding:12px 13px;font-family:var(--px);font-size:14px;line-height:1.5;color:var(--ink);border-bottom:1px solid var(--shade);transition:background .15s ease}
.mi:last-child{border-bottom:0}
.mi i{width:15px;flex:none;font-style:normal;color:var(--c);visibility:hidden}
.mi.on{background:color-mix(in srgb,var(--c) 22%,var(--panel));font-weight:600}
.mi.on i{visibility:visible;animation:blink .8s steps(2) infinite}
.info{padding:clamp(20px,3vw,32px);min-height:210px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center}
.info h3{margin:0 0 10px;font-family:var(--px);font-weight:400;font-size:clamp(21px,2.4vw,27px);line-height:1.45;color:var(--c);overflow-wrap:anywhere}
.info p{margin:0 0 14px;font-size:15px;line-height:1.8}
.go{display:inline-flex;align-items:center;justify-content:center;gap:18px;min-height:48px;padding:12px 18px;background:var(--c);color:#202838;font-family:var(--px);font-size:14px;line-height:1.5;text-decoration:none;transition:filter .15s ease}
.go:hover{filter:brightness(1.06)}
.info .pt{margin:0 0 8px;font-family:var(--px);font-weight:400;font-size:12px;color:var(--dim)}
.pfs{display:flex;flex-wrap:wrap;gap:8px}
.pf{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:var(--c);color:#2a3142;font-family:var(--px);font-size:12px}
.pf em{font-style:normal}
.pf:hover{filter:brightness(1.06)}
.info .no{margin:0;font-size:13px;color:var(--dim)}
.platform-link{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px}
.platform-domain{margin:0 0 20px!important;color:var(--dim);font-family:var(--bd2);font-size:13px!important;overflow-wrap:anywhere}
.platform-overline{margin:0 0 12px;font-family:var(--px);font-size:10px;letter-spacing:.08em;color:var(--dim)}

/* 사담: 대화창 */
.vn{display:grid;grid-template-columns:minmax(150px,.4fr) 1fr;gap:20px;align-items:start}
.slots{display:flex;flex-direction:column;gap:6px;min-width:0}
.st-crumb{padding:0 0 9px;margin-bottom:3px;border-bottom:2px dashed var(--shade);font-family:var(--px);font-size:10px;line-height:1.7;color:var(--dim);overflow-wrap:anywhere}
.st-crumb span{color:var(--c);padding:0 3px}
.sl{text-align:left;padding:9px 10px;font-family:var(--px);font-size:12px;line-height:1.5;color:var(--ink);background:var(--shade);overflow-wrap:anywhere}
.sl small{display:block;margin-top:3px;font-family:var(--bd2);font-size:11px;color:var(--dim)}
.sl.on{background:var(--c);color:#202838}.sl.on small{color:#344253}
.stg h3{margin:0 0 5px;font-family:var(--px);font-weight:400;font-size:clamp(18px,2.4vw,24px);overflow-wrap:anywhere}
.stg .dt{font-size:11px;color:var(--dim);margin-bottom:14px;line-height:1.7}
.stg .st-copy{margin:0 0 14px;font-size:13px;line-height:1.9}
.stg .st-pills{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 16px}
.stg .st-pill{padding:5px 8px;background:var(--shade);font-family:var(--px);font-size:10px;color:var(--ink)}
.stg .st-action{display:inline-block;padding:7px 11px;background:var(--c);color:#202838;font-family:var(--px);font-size:11px}
.stg .st-below{margin-top:14px;display:flex;justify-content:flex-end}
.dlg{position:relative;padding:16px 18px}
.nm{position:static;display:table;max-width:100%;margin:0 0 8px;padding:3px 10px;background:var(--c);color:#202838;font-family:var(--px);font-size:12px;line-height:1.5;box-shadow:3px 0 0 var(--bd),-3px 0 0 var(--bd),0 3px 0 var(--bd),0 -3px 0 var(--bd)}
.st-category{font-family:var(--px);font-size:10px;color:var(--dim);margin:0 0 14px}
.dlg p{margin:0 0 14px;font-size:14px;line-height:2}.dlg p:last-child{margin-bottom:0}
.nx{position:absolute;right:14px;bottom:8px;font-style:normal;font-family:var(--px);color:var(--c);animation:blink .8s steps(2) infinite}

/* 사담 글쓰기/편집 도구 */
.st-tools{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 9px}
.st-tool{padding:6px 8px;background:var(--panel);color:var(--ink);font-family:var(--px);font-size:10px;line-height:1.4;box-shadow:2px 0 0 var(--bd),-2px 0 0 var(--bd),0 2px 0 var(--bd),0 -2px 0 var(--bd)}
.st-tool.primary{background:var(--c);color:#202838}
.st-editor{display:flex;flex-direction:column;gap:10px}
.st-editor h3{margin:0;font-family:var(--px);font-weight:400;font-size:18px}
.st-editor .st-help{margin:0;color:var(--dim);font-size:11px;line-height:1.7}
.st-field{display:flex;flex-direction:column;gap:5px;min-width:0}
.st-field label{font-family:var(--px);font-size:11px;color:var(--dim)}
.st-field input,.st-field select,.st-field textarea{width:100%;min-width:0;border:2px solid var(--shade);border-radius:0;background:var(--bg);color:var(--ink);padding:9px 10px;font:13px var(--bd2);outline-offset:2px}
.st-field select{font-family:var(--px);font-size:11px}
.st-field textarea{min-height:190px;resize:vertical;line-height:1.8}
.st-fields-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st-select-action{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.st-editor-actions{display:flex;flex-wrap:wrap;gap:7px;padding-top:4px}
.st-editor-actions .st-action{border:0;cursor:pointer}
.st-editor-actions .st-cancel{padding:7px 11px;background:var(--shade);color:var(--ink);font-family:var(--px);font-size:11px}
.st-edit-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:7px;margin-top:14px}
.st-edit-actions button{padding:6px 9px;background:var(--shade);color:var(--ink);font-family:var(--px);font-size:10px}
.st-edit-actions .danger{background:#D9A1A8;color:#34232A}
.st-empty{padding:14px;background:var(--shade);font-size:12px;color:var(--dim);line-height:1.7}
@media(max-width:820px){.st-fields-2{grid-template-columns:1fr}.st-tools{margin-bottom:5px}}

/* 이미지: 앨범 */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tb{padding:8px 12px;font-family:var(--px);font-size:12px;background:var(--shade);color:var(--ink)}
.tb.on{background:var(--c);color:#2a3142}
.gg{width:100%;max-width:100%;min-width:0;margin:0 0 20px}
.gg h4{margin:0 0 10px;font-family:var(--px);font-weight:400;font-size:13px;color:var(--dim)}
.grid{display:grid;width:100%;max-width:100%;min-width:0;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid.portrait{grid-template-columns:repeat(4,minmax(0,1fr))}
.shot{display:block;width:100%;max-width:100%;min-width:0;text-align:left;--c:#f0a3b6;transition:transform .12s steps(2)}
.shot:hover{transform:translateY(-3px)}
.sv{display:block;aspect-ratio:var(--ratio);background:var(--panel);overflow:hidden;box-shadow:3px 0 0 var(--bd),-3px 0 0 var(--bd),0 3px 0 var(--bd),0 -3px 0 var(--bd)}
.sv img{width:100%;height:100%;object-fit:contain;display:block}
.ph{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:100%;font-family:var(--px);font-size:12px;color:var(--dim);border:2px dashed var(--c)}
.ph svg{width:24px}
.sc{display:block;box-sizing:border-box;width:100%;max-width:100%;min-width:0;padding:8px 1px 0;font-size:12px;line-height:1.5;white-space:normal;overflow-wrap:anywhere;word-break:break-word}
.emp{display:flex;flex-direction:column;align-items:center;gap:8px;padding:30px 0 10px;text-align:center}
.emp-st{display:flex;flex-wrap:wrap;justify-content:center;gap:22px;margin-bottom:14px}
.pk{display:flex;flex-direction:column;align-items:center;--k:#f0a3b6}
.pk .pl{position:relative;overflow:hidden;width:clamp(76px,14vw,116px);aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px;background:color-mix(in srgb,var(--k) 22%,var(--panel));box-shadow:3px 0 0 var(--bd),-3px 0 0 var(--bd),0 3px 0 var(--bd),0 -3px 0 var(--bd);animation:bob 1.2s steps(2) infinite}
.pk .pl .album-cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:0}
.pk .pl svg{position:relative;z-index:1}
.pk .pl .pl-name{position:relative;z-index:1;margin-top:auto;max-width:100%;padding:4px 5px;background:var(--k);color:#202838;font-family:var(--px);font-size:clamp(9px,1vw,12px);line-height:1.35;overflow-wrap:anywhere;text-align:center;box-shadow:2px 0 0 var(--bd),-2px 0 0 var(--bd),0 2px 0 var(--bd),0 -2px 0 var(--bd)}
.pk:nth-child(2) .pl{animation-delay:.3s}.pk:nth-child(3) .pl{animation-delay:.6s}.pk:nth-child(4) .pl{animation-delay:.9s}
.pk .pl svg{width:42%;flex:none}
.pk .pl-name{display:block;max-width:100%;padding:4px 5px;background:var(--k);color:#202838;font-family:var(--px);font-size:clamp(9px,1vw,12px);line-height:1.35;overflow-wrap:anywhere;text-align:center;box-shadow:2px 0 0 var(--bd),-2px 0 0 var(--bd),0 2px 0 var(--bd),0 -2px 0 var(--bd)}
.pk.on .pl{box-shadow:3px 0 0 var(--k),-3px 0 0 var(--k),0 3px 0 var(--k),0 -3px 0 var(--k)}
.pk.on .pl-name,.pk:hover .pl-name{filter:brightness(1.06)}
@keyframes bob{50%{transform:translateY(-6px)}}
.emp b{font-family:var(--px);font-weight:400;font-size:15px;color:var(--ink)}
.emp em{font-style:normal;font-size:12px;color:var(--dim)}

/* 로딩/전환 화면 */
.boot{position:absolute;inset:0;z-index:20;display:none;place-items:center;background:var(--c);clip-path:circle(0)}
.boot.on{display:grid;animation:iris .35s steps(5) forwards}
.boot.off{display:grid;clip-path:circle(150%);animation:irisOut .35s steps(5) forwards}
@keyframes iris{to{clip-path:circle(150%)}}
@keyframes irisOut{to{clip-path:circle(0)}}
.bt{text-align:center;color:#2a3142;font-family:var(--px)}
.bt svg{width:60px;margin:0 auto 12px}.bt b{display:block;font-weight:400;font-size:22px;margin-bottom:8px}
.bt em{font-style:normal;font-size:12px}.bt u{text-decoration:none;animation:blink .9s steps(2) infinite}
.bt u:nth-child(2){animation-delay:.2s}.bt u:nth-child(3){animation-delay:.4s}
#lb{position:absolute;inset:0;z-index:25;background:rgba(15,20,34,.9);display:none;place-items:center;padding:16px;overflow:hidden}
#lb.on{display:grid}#lb>div{width:min(86%,720px);max-height:82%;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
#lb img{width:auto;height:auto;max-width:min(80vw,680px);max-height:min(52vh,390px);object-fit:contain;display:block;box-shadow:4px 0 0 #fff,-4px 0 0 #fff,0 4px 0 #fff,0 -4px 0 #fff}
#lb p{max-width:100%;color:#f6f1e4;font-family:var(--px);font-size:12px;line-height:1.5;text-align:center;overflow-wrap:anywhere;margin:4px 0 0}
.toast{position:absolute;left:50%;bottom:44px;z-index:28;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 12px;font-family:var(--px);font-size:12px;opacity:0;pointer-events:none}
.toast.on{animation:tst 1.8s steps(6) forwards}
@keyframes tst{0%{opacity:0}10%,80%{opacity:1}100%{opacity:0}}

@media(max-width:820px){.console{filter:none}.rpg,.vn{grid-template-columns:1fr}.slots{flex-direction:row;overflow-x:auto}.sl{flex:0 0 150px}.grid,.grid.portrait{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}

/* ── CRT 곡면: 화면 전체에 일정하게. 곡면 정도(--cv 1→0)를 천천히 바꿔서 평면과 이어져요 ── */
.screen{border-radius:14px}
.screen::before{content:"";position:absolute;inset:0;z-index:29;pointer-events:none;border-radius:inherit;opacity:var(--cv,1);background:radial-gradient(ellipse at 50% 48%,transparent 55%,rgba(8,12,22,.12) 74%,rgba(8,12,22,.34) 100%);box-shadow:inset 0 0 40px 4px rgba(8,12,22,.28)}
.bezel.warped{filter:url(#warp);transform:perspective(1050px) rotateX(calc(.7deg * var(--cv,1))) scale(calc(1 - .004 * var(--cv,1)));transform-origin:center 54%;will-change:filter,transform}
@media(max-width:600px){.bezel.warped{transform:perspective(900px) rotateX(calc(.45deg * var(--cv,1))) scale(calc(1 - .002 * var(--cv,1)))}}


/* ── 모바일 전용 보정: 게임기 외형과 PC 디자인은 유지하고 터치·가독성만 조정 ── */

  .screen{height:clamp(440px,76svh,680px);min-height:0}

  .cd{width:clamp(82px,25vw,108px)}

  .gh{gap:7px;margin-bottom:12px;font-size:17px;flex-wrap:wrap}
  .gh svg{width:24px}
  .gh>span{min-width:0;overflow-wrap:anywhere}
  .bk{min-height:36px;padding:8px 10px;font-size:11px;touch-action:manipulation}
  .gh .bk{margin-left:auto}
  .win{padding:13px 14px}
  .rpg,.vn{grid-template-columns:minmax(0,1fr);gap:12px}
  .menu{gap:4px}
  .mi{min-height:42px;padding:9px 10px;font-size:12px;touch-action:manipulation}
  .info h3{font-size:16px}
  .info p{font-size:13px;line-height:1.75}
  .pfs{gap:7px}
  .pf{min-height:40px;padding:8px 10px;font-size:11px;touch-action:manipulation}
  .slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;overflow:visible;max-width:100%;padding:2px 0 9px;min-width:0}
  .st-crumb{grid-column:1/-1;font-size:10px;line-height:1.6}

  .sl small{font-size:10px}
  .stg{min-width:0;overflow-wrap:anywhere}

  .stg .st-copy{font-size:13px;line-height:1.8}
  .stg .st-pill{font-size:10px;line-height:1.4}
  .stg .st-action{min-height:40px;padding:9px 11px;font-size:11px;touch-action:manipulation}
  .dlg{padding:13px 13px}
  .nm{font-size:11px;overflow-wrap:anywhere}

  .st-tools{gap:6px}

  .st-editor h3{font-size:17px}
  .st-field label{font-size:11px}
  .st-field input,.st-field select,.st-field textarea{font-size:16px;padding:10px}
  .st-field textarea{min-height:180px}
  .st-fields-2{grid-template-columns:minmax(0,1fr)}
  .st-editor-actions .st-cancel,.st-edit-actions button{min-height:38px;padding:8px 10px;font-size:11px;touch-action:manipulation}
  .scene.g-cut{padding-left:30px;padding-right:30px;min-width:0}
  .tabs{gap:6px;margin-bottom:12px}
  .tb{min-height:40px;padding:9px 10px;font-size:11px;touch-action:manipulation}
  .grid,.grid.portrait{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .gg{margin-bottom:16px}
  .gg h4{font-size:12px}
  .sc{font-size:11px;line-height:1.5;overflow-wrap:anywhere}

  .pk{min-width:0;width:100%}

  #lb{padding:10px}
  #lb>div{width:92%;max-height:78%}
  #lb img{max-width:calc(100vw - 76px);max-height:min(46vh,320px);object-fit:contain}
  #lb p{font-size:11px;line-height:1.5;overflow-wrap:anywhere}
  .toast{width:max-content;max-width:calc(100% - 20px);white-space:normal;text-align:center;line-height:1.5;font-size:10px;bottom:42px}

/* ── 테마별 본체 외장 색상: 라이트는 밝고 부드럽게, 다크는 대비를 분명하게 ── */
body{background:var(--outside-bg,#1b2130);transition:background .22s steps(3)}
body.day-mode{
  --outside-bg:#EFF3F7;
  --shell-bg:#D4DEE8;
  --shell-edge:#AEBECD;
  --shell-highlight:#F8FAFC;
  --switch-bg:#DCE5ED;
  --switch-edge:#A7B8C8;
  --switch-ink:#42556A;
  --switch-active:#7AA6CC;
  --switch-active-ink:#13263A;
}
body.night-mode{
  --outside-bg:#151B26;
  --shell-bg:#283448;
  --shell-edge:#172233;
  --shell-highlight:#35445A;
  --switch-bg:#253247;
  --switch-edge:#101825;
  --switch-ink:#D3E0F0;
  --switch-active:#9BC4E8;
  --switch-active-ink:#1A2A3C;
}
.bezel{background:var(--shell-bg,#2a3142);box-shadow:inset 0 0 0 3px var(--shell-edge,#1a2030),inset 0 0 0 6px var(--shell-highlight,#343d50)}
.tgbar button{background:var(--switch-bg,#1f2638);color:var(--switch-ink,#8fa0b8);box-shadow:2px 0 0 var(--switch-edge,#0f1422),-2px 0 0 var(--switch-edge,#0f1422),0 2px 0 var(--switch-edge,#0f1422),0 -2px 0 var(--switch-edge,#0f1422)}
.tgbar button.on{background:var(--switch-active,#c9d4e2);color:var(--switch-active-ink,#1a2030)}
.night-mode .tgbar button{background:var(--switch-bg);color:var(--switch-ink);box-shadow:2px 0 0 var(--switch-edge),-2px 0 0 var(--switch-edge),0 2px 0 var(--switch-edge),0 -2px 0 var(--switch-edge)}
.night-mode .tgbar button.on{background:var(--switch-active);color:var(--switch-active-ink)}

/* 다크모드 명암 단계와 글자 대비 보정 */
.screen.night{
  --bg:#202A39;
  --ink:#F5F3ED;
  --dim:#CAD4E1;
  --panel:#303D51;
  --bd:#121B28;
  --shade:#46566D;
  --dot:#74869F;
  --b1:#253348;
  --b2:#2B3A50;
  --b3:#314159;
  --b4:#394A63;
  --b5:#29374B;
}
.screen.night .g-story{background:#273448;color:var(--ink)}
.screen.night .win{color:var(--ink)}
.screen.night .st-copy,.screen.night .info p,.screen.night .dlg p{color:var(--ink)}
.screen.night .st-crumb,.screen.night .stg .dt,.screen.night .st-field label{color:var(--dim)}
.screen.night .st-field input,.screen.night .st-field select,.screen.night .st-field textarea{background:#202B3B;color:#F5F3ED;border-color:#53657D}
.screen.night .sl{background:#35445A;color:#F5F3ED}
.screen.night .sl small{color:#D3DCE8}
.screen.night .sl.on{background:var(--c);color:#172334}
.screen.night .sl.on small{color:#263448}
.screen.night .st-pill{background:#40516A;color:#F5F3ED}
.screen.night .st-tools .st-tool{background:#35455B;color:#F5F3ED}
.screen.night .st-tools .st-tool.primary,.screen.night .st-action{background:var(--c);color:#1C2A3B}
.screen.night .st-empty{background:#35455B;color:#E6ECF3}
.screen.night::before{background:radial-gradient(ellipse at 50% 48%,transparent 62%,rgba(8,12,22,.08) 82%,rgba(8,12,22,.2) 100%);box-shadow:inset 0 0 26px 2px rgba(8,12,22,.16)}

/* ── 사담: 블로그형 아코디언 목록 + 오른쪽 본문 (글자 크기·대비·간격을 읽기 편하게 정리) ── */
.blog-shell{--st-paper:#fffdf7;--st-ink:#2a3140;--st-sub:#5b6574;--st-line:#d9caa3;--st-chip:#eadcb8;--st-hover:rgba(42,49,64,.07);--st-shadow:rgba(60,48,24,.12);
  display:grid;grid-template-columns:minmax(220px,.36fr) minmax(0,1fr);gap:clamp(18px,2.8vw,32px);align-items:start;min-width:0}
.screen.night .blog-shell{--st-paper:#33425a;--st-ink:#f6f3ec;--st-sub:#cdd7e4;--st-line:#566883;--st-chip:#42536e;--st-hover:rgba(255,255,255,.07);--st-shadow:rgba(0,0,0,.3)}
.g-story .gh{color:var(--ink)}
.blog-sidebar{min-width:0;padding:0 16px 0 0;border-right:2px solid var(--st-line)}
.blog-side-label{margin:0;padding:2px 4px 11px;font-family:var(--px);font-size:14px;color:var(--st-ink);border-bottom:3px solid var(--st-ink)}
.blog-side-intro{margin:0;padding:10px 4px 12px;font-size:12px;line-height:1.7;color:var(--st-sub)}
.blog-side-list{display:flex;flex-direction:column;gap:0;min-width:0}
.blog-category-item{min-width:0;border-bottom:1px solid var(--st-line)}
.blog-cat{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:12px 8px;background:transparent;color:var(--st-ink);text-align:left;font-family:var(--bd2);font-size:14px;line-height:1.45;overflow-wrap:anywhere;transition:background .16s ease}
.blog-cat:hover{background:var(--st-hover)}
.blog-cat-name{flex:1;min-width:0;font-weight:600}
.blog-cat-count{flex:none;min-width:26px;padding:1px 7px;background:var(--st-chip);color:var(--st-ink);font-size:11px;text-align:center;font-variant-numeric:tabular-nums}
.blog-cat-chevron{flex:none;width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .2s ease;margin:0 4px 4px}
.blog-cat[aria-expanded="true"]{background:color-mix(in srgb,var(--c) 26%,transparent);box-shadow:inset 4px 0 0 var(--c)}
.blog-cat[aria-expanded="true"] .blog-cat-name{font-weight:800}
.blog-cat[aria-expanded="true"] .blog-cat-chevron{transform:rotate(225deg) translate(-1px,-1px)}
.blog-cat-panel{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .24s ease,opacity .18s ease;pointer-events:none}
.blog-cat-panel.open{grid-template-rows:1fr;opacity:1;pointer-events:auto}
.blog-cat-panel-inner{min-height:0;overflow:hidden}
.blog-cat-panel-content{padding:8px 4px 16px 14px;margin:0 0 0 8px;border-left:2px dashed var(--st-line);min-width:0}
.blog-topics{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 14px}
.blog-topic{max-width:100%;padding:5px 9px;background:var(--st-chip);color:var(--st-ink);font-size:12px;line-height:1.4;text-align:left;opacity:.8;overflow-wrap:anywhere;transition:opacity .15s ease}
.blog-topic:hover{opacity:1}
.blog-topic.on{opacity:1;background:var(--st-ink);color:var(--st-paper);font-weight:700}
.blog-list-heading{margin:0 0 4px;font-family:var(--px);font-size:11px;color:var(--st-sub)}
.blog-postlist{min-width:0;display:flex;flex-direction:column;gap:0}
.blog-post{display:block;width:100%;min-width:0;padding:11px 8px 12px;background:transparent;color:var(--st-ink);text-align:left;border:0;border-bottom:1px solid var(--st-line);line-height:1.5;overflow-wrap:anywhere;transition:background .15s ease,padding .15s ease}
.blog-post:last-child{border-bottom:0}
.blog-post:hover{background:var(--st-hover)}
.blog-post.on{background:color-mix(in srgb,var(--c) 22%,transparent);box-shadow:inset 4px 0 0 var(--c);padding-left:13px}
.blog-post-title{display:block;font-size:14px;line-height:1.55;font-weight:700;word-break:keep-all}
.blog-post-meta{display:block;margin-top:3px;font-size:11px;line-height:1.5;color:var(--st-sub)}
.blog-post-excerpt{display:none}
.blog-main{min-width:0}
.blog-article{min-width:0;min-height:300px;margin:4px;padding:clamp(22px,3.4vw,40px);background:var(--st-paper);color:var(--st-ink);
  box-shadow:4px 0 0 var(--st-line),-4px 0 0 var(--st-line),0 4px 0 var(--st-line),0 -4px 0 var(--st-line),8px 10px 0 4px var(--st-shadow)}
.blog-article-empty{min-height:250px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:10px;color:var(--st-sub);font-size:14px;line-height:1.8}
.blog-article-empty strong{color:var(--st-ink);font-family:var(--px);font-weight:400;font-size:17px;line-height:1.6}
.blog-article-empty svg{width:34px;margin-bottom:4px}
.blog-article-kicker{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px;font-family:var(--px);font-size:11px;line-height:1.6;color:var(--st-sub);overflow-wrap:anywhere}
.blog-article-kicker::before{content:"";width:10px;height:10px;flex:none;background:var(--c)}
.blog-article h3{position:relative;margin:0 0 16px;padding-bottom:18px;color:var(--st-ink);font-family:var(--bd2);font-size:clamp(22px,2.7vw,30px);font-weight:800;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere}
.blog-article h3::after{content:"";position:absolute;left:0;bottom:0;width:64px;height:6px;background:var(--c)}
.blog-article-date{display:inline-block;margin:0 0 24px;padding:3px 9px;background:var(--st-chip);color:var(--st-ink);font-size:12px;line-height:1.6;border:0}
.blog-article-body{max-width:40em;font-size:15.5px;color:var(--st-ink);line-height:2.05;word-break:keep-all;overflow-wrap:anywhere}
.blog-article-body p{margin:0 0 1.15em;white-space:pre-wrap}
.blog-article-body p:last-child{margin-bottom:0}
.blog-article-body h2,.blog-article-body h3,.blog-article-body h4{margin:1.7em 0 .6em;padding:0;font-size:1.12em;line-height:1.5;color:var(--st-ink)}
.blog-article-body h3::after{display:none}
.blog-article-body ul,.blog-article-body ol{padding-left:1.4em;margin:0 0 1.15em}
.blog-article-body li{margin:.3em 0}
.blog-article-body blockquote{margin:1.2em 0;padding:.5em 0 .5em 14px;border-left:4px solid var(--c);background:color-mix(in srgb,var(--st-chip) 55%,transparent);color:var(--st-sub)}
.blog-article-body a{color:var(--st-ink);text-decoration:underline;text-decoration-color:var(--c);text-decoration-thickness:3px;text-underline-offset:3px}
.blog-article-body code{padding:1px 5px;background:var(--st-chip);border:0;font-size:.92em}
.blog-article-body hr{border:0;border-top:2px dashed var(--st-line);margin:1.6em 0}

<script>
/* ===== ✏️ 내용 입력 구역 ===== */
/* 사용 플랫폼은 Pages CMS의 data/platforms.json에서 불러옵니다. */
let PLATFORMS=[];
/* 사담 게시글은 Pages CMS가 관리하는 JSON 파일에서 불러옵니다. */
let STORIES=[];
let storyLoadState='idle';
let storyLoadError='';
let storyLoadSerial=0;
const STORY_DATA_URL='./data/stories.json';
/* 앨범 목록과 대표 이미지는 Pages CMS의 data/gallery.json에서 관리합니다. */
let ALBUMS=[];

/* CMS에서 관리하는 사용 플랫폼과 이미지 앨범을 불러옵니다. */
let catalogDataPromise = null;
function catalogImageUrl(value){
  const valueText = String(value == null ? '' : value).trim();
  if(!valueText) return '';
  if(/^(?:https?:|data:|blob:|\/\/)/i.test(valueText)) return valueText;
  /* Pages CMS가 /media/...로 저장해도 저장소 하위 경로에서 열리게 조정 */
  return './' + valueText.replace(/^\.?\//, '').replace(/^\/+/, '');
}
function defaultPlatformDescription(name){
  const key=String(name||'').toLowerCase().replace(/\s+/g,'');
  if(key.includes('유니챗') || key.includes('unichat')) return '메인 플랫폼. 온리가 끝나면 다른 플랫폼으로 이식될 수 있음.';
  if(key.includes('케이브덕') || key.includes('caveduck') || key.includes('cave-duck') || key.includes('cave_duck')) return '케이브덕 온리 캐릭터만 올림.';
  if(key.includes('로판') || key.includes('ropan')) return '개인 캐릭터만 올림. 제작창 제한으로 업로드가 어려움.';
  return '';
}
async function loadCatalogData(){
  if(catalogDataPromise) return catalogDataPromise;
  catalogDataPromise = (async()=>{
    const results = await Promise.allSettled([
      fetch('./data/platforms.json', {cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('platforms.json HTTP '+r.status);return r.json()}),
      fetch('./data/gallery.json', {cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('gallery.json HTTP '+r.status);return r.json()})
    ]);
    if(results[0].status==='fulfilled' && Array.isArray(results[0].value)){
      PLATFORMS = results[0].value.map(p=>{
        const name=String(p && p.name || '이름 없는 플랫폼');
        const savedDescription=String(p && (p.description || p.purpose || p.note || p.memo) || '').trim();
        return {
          name:name,
          url:String(p && p.url || ''),
          description:defaultPlatformDescription(name) || savedDescription
        };
      });
    }
    if(results[1].status==='fulfilled' && Array.isArray(results[1].value)){
      ALBUMS = results[1].value.map(a=>{
        const bulkImages = Array.isArray(a && a.images);
        const imageItems = bulkImages
          ? a.images.map((value,imageIndex)=>{
              const src = String(typeof value === 'string' ? value : (value && (value.src || value.url)) || '');
              const savedCaption = value && typeof value === 'object' ? String(value.cap || value.title || '').trim() : '';
              /* CMS bulk uploads normally save URLs only; do not expose long, messy filenames as captions. */
              const cap = savedCaption || `그림 ${imageIndex+1}`;
              return {src, cap, w:0, h:0};
            }).filter(item=>item.src)
          : (Array.isArray(a && a.items) ? a.items.map(m=>({
              src:String(m && m.src || ''), cap:String(m && m.cap || ''),
              w:Number(m && m.w) || 4, h:Number(m && m.h) || 3
            })).filter(item=>item.src) : []);
        return {
          name:String(a && a.name || '이름 없는 앨범'),
          cover:String(a && a.cover || ''),
          items:imageItems,
          autoRatio:bulkImages
        };
      });
    }
  })();
  return catalogDataPromise;
}
/* 시디 3장 (색은 어두운/밝은 화면마다 따로 있어요) */
const PAL={night:['#9bc4e8','#e2c984','#e3aabd'],day:['#7aa6cc','#d2b567','#d691a4']};
let night=false; /* 밝은 화면이 기본 */
const G=[
  {id:'plat',name:'사용 플랫폼',c:'#8cc4f0',hint:'',icon:'win'},
  {id:'story',name:'잡담',c:'#f3d27a',hint:'가볍게 캐릭터 및 플랫폼 이야기 (tmi 많음)',icon:'bubble'},
  {id:'cut',name:'티스토리',c:'#f0a3b6',hint:'캐릭터 비하인드 및 이미지 확인',icon:'bubble'},
];

/* 색 섞기 */
function mixHex(a,b,t){
  const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
  const x=p(a),y=p(b);
  return '#'+x.map((v,i)=>Math.round(v*(1-t)+y[i]*t).toString(16).padStart(2,'0')).join('');
}
/* 단순한 도트 CD (16×16 도트로만 그려요) */
function disc(c){
  const m=7.5,hi=mixHex(c,'#ffffff',.5),rim=mixHex(c,'#2a3142',.2);let r='';
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){
    const d=Math.hypot(x-m,y-m);if(d>7.9||d<1.6)continue;
    let f=c;
    if(d<3.4)f='#f4f0e4';
    else if(d>5.1&&d<6.1)f=hi;
    else if(d>7)f=rim;
    else if(x<m&&y<m&&d>6.1&&d<7)f='#ffffff';
    r+=`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${f}"/>`;
  }
  return `<svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
}

/* 곡면 렌즈: 왜곡 지도를 직접 만들어 가운데를 볼록하게 */
const warpImg=$('#warpImg'),warpMap=$('#warpMap'),warpMaskImg=$('#warpMaskImg');
(function(){try{
  const M=128,cv=document.createElement('canvas');cv.width=cv.height=M;
  const cx=cv.getContext('2d'),im=cx.createImageData(M,M);
  for(let y=0;y<M;y++)for(let x=0;x<M;x++){
    const u=x/(M-1)*2-1,v=y/(M-1)*2-1,r2=u*u+v*v,i=(y*M+x)*4;
    im.data[i]=Math.max(0,Math.min(255,Math.round((.5+.5*u*(r2-1))*255)));
    im.data[i+1]=Math.max(0,Math.min(255,Math.round((.5+.5*v*(r2-1))*255)));
    im.data[i+2]=128;im.data[i+3]=255}
  cx.putImageData(im,0,0);warpImg.setAttribute('href',cv.toDataURL());
  const maskCanvas=document.createElement('canvas');maskCanvas.width=maskCanvas.height=M;
  const mx=maskCanvas.getContext('2d');
  /* 화면 외부로 밀려난 픽셀만 자르도록 본체 경계에 맞춘 마스크.
     이전 마스크는 좌우 가장자리를 2.5~4% 안쪽에서 시작해 테두리까지 잘랐습니다. */
  mx.fillStyle='#fff';mx.beginPath();
  mx.moveTo(M*.025,0);
  mx.lineTo(M*.975,0);
  mx.bezierCurveTo(M*.989,0,M,M*.014,M,M*.033);
  mx.lineTo(M,M*.967);
  mx.bezierCurveTo(M,M*.986,M*.989,M,M*.975,M);
  mx.lineTo(M*.025,M);
  mx.bezierCurveTo(M*.011,M,0,M*.986,0,M*.967);
  mx.lineTo(0,M*.033);
  mx.bezierCurveTo(0,M*.014,M*.011,0,M*.025,0);
  mx.closePath();mx.fill();
  warpMaskImg.setAttribute('href',maskCanvas.toDataURL());
}catch(e){}})();
const K=0.11; /* 곡면 세기 (0.08 약하게 ~ 0.2 강하게) */
let cur=1,curRaf=0; /* 현재 곡면 정도: 1 = 완전히 볼록, 0 = 평평 */
function fitWarp(){const w=bez.offsetWidth,h=bez.offsetHeight;if(!w)return;
  warpImg.setAttribute('width',w);warpImg.setAttribute('height',h);warpMaskImg.setAttribute('width',w);warpMaskImg.setAttribute('height',h);
  warpMap.setAttribute('scale',Math.min(62,(K/(1+K))*((w+h)/2)*cur).toFixed(2))}
function setCurve(v){cur=v;scr.style.setProperty('--cv',v.toFixed(3));bez.style.setProperty('--cv',v.toFixed(3));bez.classList.toggle('warped',v>0.002);fitWarp()}
function curveTo(to,ms){return new Promise(res=>{
  const from=cur,t0=performance.now();cancelAnimationFrame(curRaf);
  const step=now=>{const t=Math.min(1,(now-t0)/ms),e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    setCurve(from+(to-from)*e);if(t<1)curRaf=requestAnimationFrame(step);else res()};
  curRaf=requestAnimationFrame(step)})}
new ResizeObserver(fitWarp).observe(bez);setCurve(1);

    b.addEventListener('click',()=>{if(performance.now()<suppress||busy)return;const cur2=((Math.round(target)%N)+N)%N,step=Math.round(norm(i-cur2));if(step!==0)rotate(step);else start(g.id)});
    stage.appendChild(b);return b});

function layout(){
  if(!stage)return;W=stage.clientWidth;H=stage.clientHeight;if(!W)return;
  R=W<560?W*.48:Math.max(W*.62,230);cy=H*.5;const py=cy+R;
  track.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const ringRadii=W<560?[Math.max(20,R*.46),R*.74,R*1.02]:[R-90,R,R+90];
  track.innerHTML=`<g id="tg">`+ringRadii.map((r,k)=>`<circle cx="${W/2}" cy="${py}" r="${r}" fill="none" stroke="${night?G[k].c:mixHex(G[k].c,'#2a3142',.4)}" stroke-width="${W<560?3:4}" stroke-dasharray="${W<560?'3 '+(k===1?10:16):'4 '+(k===1?14:22)}" opacity="${night?(k===1?.55:.3):(k===1?.95:.65)}" shape-rendering="crispEdges"/>`).join('')+`</g>`;

function draw(){
  if(!W)return;const py=cy+R;
  cds.forEach((el,i)=>{
    const d=norm(i-pos),a=d*STEP*Math.PI/180,ad=Math.abs(d);
    const x=Math.round((W/2+R*Math.sin(a))/4)*4,y=Math.round((py-R*Math.cos(a))/4)*4;
    el.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%) scale(${(1-.12*Math.min(ad,1.3)).toFixed(3)})`;
    el.style.opacity=ad<1?1:Math.max(0,1-(ad-1)*3);
    el.style.zIndex=10-Math.round(ad*4);
    el.style.filter=`brightness(${(1-.1*Math.min(ad,1)).toFixed(2)})`;
    el.classList.toggle('on',ad<.5);

function sync(i){

function stepAnim(now=0){
  /* 작게 끊어 움직이는 느린 도트식 이동 */
  if(now-lastTick<42){raf=requestAnimationFrame(stepAnim);return}
  lastTick=now;const diff=target-pos;
  pos+=Math.sign(diff)*Math.min(Math.abs(diff),.052);
  if(Math.abs(target-pos)<.006){pos=target;raf=0;draw();return}
  draw();raf=requestAnimationFrame(stepAnim);
}
function rotate(n){target+=n;sync(Math.round(target));if(!raf)raf=requestAnimationFrame(stepAnim)}
function finishDrag(e){
  if(!drag||(e&&e.pointerId!==drag.pointerId))return;
  stage.classList.remove('dragging');
  if(drag.moved){suppress=performance.now()+420;target=Math.round(pos);sync(target);if(!raf)raf=requestAnimationFrame(stepAnim)}
  drag=null;
}
function bindDrag(){
  stage.addEventListener('pointerdown',e=>{if(where!=='home'||busy||e.button>0)return;drag={pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,startPos:pos,moved:false}});
  stage.addEventListener('pointermove',e=>{
    if(!drag||e.pointerId!==drag.pointerId)return;
    const dx=e.clientX-drag.startX,dy=e.clientY-drag.startY;
    if(!drag.moved&&Math.abs(dx)>7&&Math.abs(dx)>Math.abs(dy)*.75){drag.moved=true;stage.classList.add('dragging');try{stage.setPointerCapture(e.pointerId)}catch(_){}}
    if(!drag.moved)return;e.preventDefault();
    pos=drag.startPos-dx/Math.max(90,R*Math.sin(STEP*Math.PI/180));target=pos;
    const nx=((Math.round(pos)%N)+N)%N;if(nx!==sel)sync(nx);draw();
  },{passive:false});
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>stage.addEventListener(t,finishDrag));
}

/* 게임 시작/종료 연출
   시작: 곡면이 먼저 천천히 펴짐 → 동그란 로딩 화면이 열렸다 닫히며 내용 교체
   종료: 평평한 채로 내용 교체 → 곡면이 천천히 다시 휘어짐 */
async function transition(g,label,fn,curveAfter){
  if(busy)return;busy=true;
  if(!curveAfter)await curveTo(0,480);
  boot.style.setProperty('--c',g.c);
  boot.innerHTML=`<div class="bt">${icon(g.icon,'#2a3142','#fff','#fff')}<b>${g.name}</b><em>${label}<u>.</u><u>.</u><u>.</u></em></div>`;
  boot.className='boot on';
  await wait(label==='LOADING'?950:600);
  if(curveAfter){
    /* 메인으로 돌아갈 때는 로딩 화면이 덮여 있는 동안 곡률을 먼저 시작해요. */
    const curveMotion=curveTo(1,600);
    await wait(240);
    await fn();scene.scrollTop=0;boot.className='boot off';
    await wait(380);boot.className='boot';
    await curveMotion;
  }else{
    await fn();scene.scrollTop=0;boot.className='boot off';
    await wait(380);boot.className='boot';
  }
  busy=false;
}
function start(id){const g=G.find(x=>x.id===id);transition(g,'LOADING',()=>enter(id),false)}
function exit(){if(where==='home')return;const g=G.find(x=>x.id===where);transition(g,'SAVING',()=>{clearInterval(tm);home()},true)}
async function enter(id){

  const bk=document.createElement('button');bk.className='bk';bk.textContent='← 홈';bk.addEventListener('click',exit);scene.querySelector('.gh').appendChild(bk);
}

function platDomain(p){try{return new URL(p.url).hostname.replace(/^www\./i,'')}catch(_){return ''}}

/* 2. 잡담 : 큰 맥락 → 작은 맥락 → 글 제목 → 본문 */
function storyEscape(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function storyDisplayDate(value){
  const s=String(value||'');
  return /^\d{4}-\d{2}-\d{2}$/.test(s)?s.replace(/-/g,'.'):s;
}
function storyInlineMarkdown(value){
  let s=storyEscape(value);
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|mailto:[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/__([^_]+)__/g,'<strong>$1</strong>');
  s=s.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  s=s.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  s=s.replace(/(^|[^_])_([^_\n]+)_/g,'$1<em>$2</em>');
  return s;
}
function renderStoryBody(value){
  const raw=(Array.isArray(value)?value.join('\n\n'):String(value||'')).replace(/\r\n?/g,'\n').trim();
  if(!raw)return '';
  const blocks=raw.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
  return blocks.map(block=>{
    if(/^([-*_])\1\1+\s*$/.test(block))return '<hr>';
    const h=block.match(/^(#{1,4})\s+([\s\S]+)$/);
    if(h){const n=h[1].length+1;return '<h'+n+'>'+storyInlineMarkdown(h[2])+'</h'+n+'>';}
    if(block.split('\n').every(line=>/^\s*>/.test(line)))return '<blockquote>'+block.split('\n').map(line=>storyInlineMarkdown(line.replace(/^\s*>\s?/,''))).join('<br>')+'</blockquote>';
    const lines=block.split('\n');
    if(lines.every(line=>/^\s*[-*+]\s+/.test(line)))return '<ul>'+lines.map(line=>'<li>'+storyInlineMarkdown(line.replace(/^\s*[-*+]\s+/,''))+'</li>').join('')+'</ul>';
    if(lines.every(line=>/^\s*\d+\.\s+/.test(line)))return '<ol>'+lines.map(line=>'<li>'+storyInlineMarkdown(line.replace(/^\s*\d+\.\s+/,''))+'</li>').join('')+'</ol>';
    return '<p>'+lines.map(storyInlineMarkdown).join('<br>')+'</p>';
  }).join('');
}
function storyBodyPlainText(value){
  const raw=Array.isArray(value)?value.join(' '):String(value||'');
  return raw.replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/<[^>]*>/g,' ').replace(/[`*_~#>]/g,'').replace(/\s+/g,' ').trim();
}
function normalizeStoryData(input){
  const rows=Array.isArray(input)?input:(input&&Array.isArray(input.posts)?input.posts:null);
  if(!Array.isArray(rows))throw new Error('게시글 데이터가 배열 형식이 아닙니다.');
  /* 이전 계층형 데이터도 평탄화하여 카테고리 + 태그 구조로 읽습니다. */
  const flatRows=[];
  rows.forEach(row=>{
    if(!row||typeof row!=='object')return;
    if(Array.isArray(row.topics)){
      row.topics.forEach(topic=>{
        (topic.entries||[]).forEach(entry=>flatRows.push({
          category:row.title,subcategory:topic.title,title:entry.title,date:entry.date,body:entry.body
        }));
      });
    }else flatRows.push(row);
  });
  const categories=[];
  flatRows.forEach(row=>{
    if(!row||typeof row!=='object')return;
    const categoryName=String(row.category||'미분류').trim()||'미분류';
    const tagName=String(row.subcategory||'기타').trim()||'기타';
    let category=categories.find(item=>item.title===categoryName);
    if(!category){category={title:categoryName,entries:[]};categories.push(category)}
    let body=[];
    if(Array.isArray(row.body))body=row.body.map(v=>String(v)).filter(v=>v.trim());
    else body=String(row.body||'').split(/\n\s*\n/).map(v=>v.trim()).filter(Boolean);
    category.entries.push({
      topicTitle:tagName,
      title:String(row.title||'제목 없음'),
      date:storyDisplayDate(row.date),
      body
    });
  });
  return categories;
}
async function loadStoryData(){
  const requestId=++storyLoadSerial;
  storyLoadState='loading';storyLoadError='';STORIES=[];drawStory();
  try{
    const response=await fetch(STORY_DATA_URL,{cache:'no-store'});
    if(!response.ok)throw new Error('HTTP '+response.status);
    const raw=await response.json();
    const data=normalizeStoryData(raw);
    if(requestId!==storyLoadSerial||where!=='story')return;
    STORIES=data;storyLoadState='ready';storyLoadError='';
    stCat=0;stTopic=-1;stEntry=0;stLevel='list';stAccordionOpen=false;drawStory();
  }catch(err){
    if(requestId!==storyLoadSerial||where!=='story')return;
    storyLoadState='error';storyLoadError=String(err&&err.message||err);STORIES=[];drawStory();
  }
}

  stLevel='list';stCat=0;stTopic=-1;stEntry=0;stAccordionOpen=false;stEditing=false;stEditTarget=null;

function storyTagsFor(category){
  if(!category)return [];
  return [...new Set((category.entries||[]).map(entry=>String(entry.topicTitle||'기타')))].filter(Boolean);
}
function storyTags(){return storyTagsFor(STORIES[stCat])}
function storyVisibleEntries(){
  if(!STORIES.length||!STORIES[stCat])return [];
  const cat=STORIES[stCat],tags=storyTags();
  const all=cat.entries||[];
  const filtered=stTopic<0?all:all.filter(entry=>String(entry.topicTitle||'기타')===tags[stTopic]);
  return filtered.map(entry=>({
    title:String(entry.title||'제목 없음'),date:String(entry.date||''),body:Array.isArray(entry.body)?entry.body:[],
    categoryTitle:cat.title,topicTitle:String(entry.topicTitle||'기타')
  })).sort((a,b)=>{
    const da=String(a.date||'').replace(/\./g,'-'),db=String(b.date||'').replace(/\./g,'-');
    return db.localeCompare(da);
  });
}
function storyItems(){return storyVisibleEntries()}
function storyIndex(){return stEntry}
function setStoryIndex(i){stEntry=i}
function storyOpen(){stAccordionOpen=true;stLevel='article';drawStory()}
function storyBack(){
  if(stLevel==='article'){stLevel='list';drawStory()}
  else exit();
}
function storySelect(i){stEntry=i;stAccordionOpen=true;stLevel='article';drawStory()}
function storyArticleEmpty(){
  return `<div class="blog-article-empty">${icon('bubble',G[1].c)}<strong>읽고 싶은 글을 골라 주세요.</strong><span>왼쪽에서 카테고리를 펼치고 제목을 누르면 이 자리에 본문이 나와요.</span></div>`;
}
function makeStoryPanel(category,index,isOpen){
  const tags=storyTagsFor(category);
  const selectedTags=index===stCat?stTopic:-1;
  const safeSelected=selectedTags>=tags.length?-1:selectedTags;
  const counts=(tag)=> (category.entries||[]).filter(entry=>String(entry.topicTitle||'기타')===tag).length;
  const tagButtons=`<div class="blog-topics"><button class="blog-topic${safeSelected<0?' on':''}" data-topic="-1" data-cat-owner="${index}">전체 ${(category.entries||[]).length}</button>${tags.map((tag,i)=>`<button class="blog-topic${i===safeSelected?' on':''}" data-topic="${i}" data-cat-owner="${index}">${storyEscape(tag)} ${counts(tag)}</button>`).join('')}</div>`;
  let entries;
  if(index===stCat){entries=storyVisibleEntries();}
  else{entries=(category.entries||[]).map(entry=>({title:String(entry.title||'제목 없음'),date:storyDisplayDate(entry.date),body:Array.isArray(entry.body)?entry.body:String(entry.body||'').split(/\n\s*\n/).filter(Boolean),categoryTitle:category.title,topicTitle:String(entry.topicTitle||'기타')})).sort((a,b)=>String(b.date).localeCompare(String(a.date)));}
  const postMarkup=entries.length
    ? `<div class="blog-list-heading">게시글 ${entries.length}개</div><section class="blog-postlist" aria-label="${storyEscape(category.title)} 게시글">${entries.map((entry,i)=>{
        const excerpt=storyBodyPlainText(entry.body);
        return `<button class="blog-post${index===stCat&&i===stEntry?' on':''}" data-post="${i}" data-cat-owner="${index}"><span class="blog-post-title">${storyEscape(entry.title)}</span><span class="blog-post-meta">${storyEscape(entry.topicTitle)}　·　${storyEscape(entry.date)}</span><span class="blog-post-excerpt">${storyEscape(excerpt.slice(0,76))}${excerpt.length>76?'…':''}</span></button>`;
      }).join('')}</section>`
    : `<div class="blog-status">이 카테고리에는 아직 게시글이 없어요.</div>`;
  return `<div class="blog-cat-panel-content">${tagButtons}${postMarkup}</div>`;
}
function drawStory(){
  const categoryList=$('#blogCategoryList'),article=$('#blogArticle'),shell=$('#blogShell');
  if(!categoryList||!article||!shell)return;
  if(storyLoadState==='loading'){
    categoryList.innerHTML='';article.innerHTML='<div class="blog-status">잡담 게시글을 불러오고 있어요…</div>';setHint('잡담 게시글 불러오는 중…');return;
  }
  if(storyLoadState==='error'){
    categoryList.innerHTML='';
    article.innerHTML=`<div class="blog-status"><strong>게시글을 불러오지 못했어요.</strong><p>GitHub 저장소에 <code>data/stories.json</code> 파일이 있는지, 홈페이지가 GitHub Pages 주소에서 열려 있는지 확인해 주세요.</p><p>오류: ${storyEscape(storyLoadError)}</p><button class="st-action" id="stRetry">다시 불러오기</button></div>`;
    $('#stRetry').addEventListener('click',loadStoryData);setHint('게시글 불러오기 오류 · Esc로 홈으로');return;
  }
  if(!STORIES.length){
    categoryList.innerHTML='<div class="blog-status">아직 카테고리가 없어요.</div>';
    article.innerHTML='<div class="blog-article-empty"><strong>잡담 보관함</strong><span>Pages CMS에서 첫 게시글을 저장하면 여기에 표시됩니다.</span></div>';
    setHint('게시글은 Pages CMS에서 관리');return;
  }
  stCat=Math.max(0,Math.min(stCat,STORIES.length-1));
  if(!STORIES[stCat].entries)STORIES[stCat].entries=[];
  const activeCat=STORIES[stCat];
  const activeTags=storyTagsFor(activeCat);
  if(stTopic>=activeTags.length)stTopic=-1;
  let activeEntries=storyVisibleEntries();
  if(activeEntries.length)stEntry=Math.max(0,Math.min(stEntry,activeEntries.length-1));else stEntry=0;
  categoryList.innerHTML=STORIES.map((category,i)=>{
    const count=(category.entries||[]).length;
    const isOpen=stAccordionOpen&&i===stCat;
    return `<section class="blog-category-item${isOpen?' expanded':''}"><button class="blog-cat" data-cat="${i}" aria-expanded="${isOpen?'true':'false'}" aria-controls="blog-category-panel-${i}"><span class="blog-cat-name">${storyEscape(category.title)}</span><small class="blog-cat-count">${count}</small><span class="blog-cat-chevron" aria-hidden="true"></span></button><div id="blog-category-panel-${i}" class="blog-cat-panel${isOpen?' open':''}" aria-hidden="${isOpen?'false':'true'}"><div class="blog-cat-panel-inner">${makeStoryPanel(category,i,isOpen)}</div></div></section>`;
  }).join('');
  categoryList.querySelectorAll('[data-cat]').forEach(button=>button.addEventListener('click',()=>{
    const next=Number(button.dataset.cat);
    if(next===stCat&&stAccordionOpen){stAccordionOpen=false;stLevel='list';article.innerHTML=storyArticleEmpty();}
    else{stCat=next;stTopic=-1;stEntry=0;stAccordionOpen=true;stLevel='list';article.innerHTML=storyArticleEmpty();}
    drawStory();
  }));
  categoryList.querySelectorAll('[data-topic]').forEach(button=>button.addEventListener('click',()=>{
    stCat=Number(button.dataset.catOwner);stTopic=Number(button.dataset.topic);stEntry=0;stAccordionOpen=true;stLevel='list';article.innerHTML=storyArticleEmpty();drawStory();
  }));
  categoryList.querySelectorAll('[data-post]').forEach(button=>button.addEventListener('click',()=>{
    stCat=Number(button.dataset.catOwner);stAccordionOpen=true;
    stEntry=Number(button.dataset.post);stLevel='article';scene.scrollTop=0;drawStory();
  }));
  activeEntries=storyVisibleEntries();
  if(stLevel==='article'&&activeEntries.length){
    stEntry=Math.max(0,Math.min(stEntry,activeEntries.length-1));
    const selected=activeEntries[stEntry],prev=activeEntries[stEntry-1],next=activeEntries[stEntry+1];
    shell.classList.add('article-open');
    article.innerHTML=`<button class="blog-back" data-blog-back>← 게시글 목록</button><div class="blog-article-kicker"><span>${storyEscape(selected.categoryTitle)}</span><span>/</span><span>${storyEscape(selected.topicTitle)}</span></div><h3>${storyEscape(selected.title)}</h3><div class="blog-article-date">${storyEscape(selected.date)}</div><div class="blog-article-body">${renderStoryBody(selected.body)}</div><nav class="blog-nav" aria-label="글 이동"><button class="blog-nav-btn" data-nav="-1"${prev?'':' disabled'}><span>◀ 위의 글</span><b>${prev?storyEscape(prev.title):'첫 번째 글이에요'}</b></button><button class="blog-nav-btn next" data-nav="1"${next?'':' disabled'}><span>아래 글 ▶</span><b>${next?storyEscape(next.title):'마지막 글이에요'}</b></button></nav>`;
    const back=article.querySelector('[data-blog-back]');if(back)back.addEventListener('click',()=>{stLevel='list';drawStory()});
    article.querySelectorAll('[data-nav]').forEach(button=>button.addEventListener('click',()=>{stEntry+=Number(button.dataset.nav);scene.scrollTop=0;drawStory()}));
  }else{
    shell.classList.remove('article-open');
    article.innerHTML=storyArticleEmpty();
  }
  setHint(stLevel==='article'?'◀ ▶ 위·아래 글 · ▲ ▼ 글 고르기 · Esc 목록으로':'카테고리를 펼쳐 태그와 게시글을 찾아보세요 · Esc 홈으로');
}

    '<rect x="12" y="12" width="216" height="296" fill="var(--cover-paper)"/><path d="M26 70Q60 22 91 74T155 72T214 73" fill="none" stroke="var(--cover-accent)" stroke-width="5"/><path d="M26 124Q60 76 91 128T155 126T214 127" fill="none" stroke="var(--cover-accent)" stroke-width="5"/><path d="M26 178Q60 130 91 182T155 180T214 181" fill="none" stroke="var(--cover-accent)" stroke-width="5"/><circle cx="120" cy="246" r="28" fill="var(--cover-accent)" opacity=".8"/>'
  ];
  return `<svg viewBox="0 0 240 320" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${motifs[((index%motifs.length)+motifs.length)%motifs.length]}</svg>`;
}
function albumCoverFallback(name,index,accent){
  const title=String(name||'이미지 앨범');
  return `<span class="album-cover-fallback" style="--cover-accent:${accent}">${albumArtSvg(index)}<span class="album-cover-kicker">VISUAL ARCHIVE · ${(index+1).toString().padStart(2,'0')}</span><span class="album-cover-title">${storyEscape(title)}</span><span class="album-cover-foot">A COLLECTION OF IMAGES</span></span>`;
}
function imageLoadFallback(index,accent){
  return `<span class="image-load-fallback" style="--cover-accent:${accent}">${albumArtSvg(index)}<span>이미지를 불러오지 못했어요</span></span>`;
}
function bindAlbumCoverFallbacks(){
  $('#gal').querySelectorAll('.album-cover').forEach(img=>{
    const fallback=()=>{
      if(!img.isConnected)return;
      const button=img.closest('.pk');const i=button?Number(button.dataset.i):0;const album=ALBUMS[i];
      img.insertAdjacentHTML('beforebegin',albumCoverFallback(album?album.name:'이미지 앨범',i,['#7aa6cc','#d2b567','#d691a4','#7ea58f'][i%4]));img.remove();
    };
    img.addEventListener('error',fallback,{once:true});if(img.complete&&img.naturalWidth===0)fallback();
  });
}
function bindBrokenGalleryImages(){
  $('#gal').querySelectorAll('.shot img').forEach(img=>{
    const fallback=()=>{
      if(!img.isConnected)return;
      const shot=img.closest('.shot');const index=shot?Array.from($('#gal').querySelectorAll('.shot')).indexOf(shot):0;
      const accent=shot?(getComputedStyle(shot).getPropertyValue('--c').trim()||'#9aaec4'):'#9aaec4';
      img.insertAdjacentHTML('beforebegin',imageLoadFallback(Math.max(0,index),accent));img.remove();
    };
    img.addEventListener('error',fallback,{once:true});if(img.complete&&img.naturalWidth===0)fallback();
  });
}

/* 3. 이미지 : 캐릭터 고르기 창 → 그 캐릭터의 앨범 */
function cut(){
  const g=G[2];
  scene.innerHTML=`<div class="gh">${icon('photo',g.c)}<span id="gt">${g.name}</span></div><div id="gal"></div>`;
  ai=-1;drawAlbum();
}
function drawAlbum(){
  const old=$('#bkl');if(old)old.remove();
  const C=[...G.map(g=>g.c),night?'#8fc3a6':'#7ea58f'];
  scene.scrollTop=0;
  if(ai<0){
    $('#gt').textContent=G[2].name;
    if(!ALBUMS.length){$('#gal').innerHTML='<div class="emp"><b>아직 이미지 앨범이 없어요</b><em>Pages CMS의 이미지 앨범 메뉴에서 추가해 주세요.</em></div>';setHint('이미지 앨범은 Pages CMS에서 관리');return}
    ci=Math.max(0,Math.min(ci,ALBUMS.length-1));
    $('#gal').innerHTML=`<div class="emp"><div class="emp-st">${ALBUMS.map((a,i)=>{
      const cover=catalogImageUrl(a.cover || (a.items && a.items.length ? a.items[0].src : ''));
      const visual=cover?`<img class="album-cover" src="${storyEscape(cover)}" alt="${storyEscape(a.name)} 앨범 표지" loading="lazy">`:albumCoverFallback(a.name,i,C[i%4]);
      return `<button class="pk${i===ci?' on':''}" style="--k:${C[i%4]}" data-i="${i}"><span class="pl">${visual}<span class="pl-name">${storyEscape(a.name)}</span></span></button>`;
    }).join('')}</div><b>앨범을 골라 보세요</b><em>대표 이미지를 누르면 그 앨범의 그림이 펼쳐져요</em></div>`;
    $('#gal').querySelectorAll('.pk').forEach(b=>b.addEventListener('click',()=>{ai=ci=+b.dataset.i;drawAlbum()}));
    bindAlbumCoverFallbacks();
    setHint('◀ ▶ 앨범 고르기 · Enter 열기 · Esc 홈으로');
    return;
  }
  const al=ALBUMS[ai],gh=scene.querySelector('.gh');
  $('#gt').textContent=G[2].name+' · '+al.name;
  const bk=document.createElement('button');bk.id='bkl';bk.className='bk';bk.textContent='← 앨범 목록';
  bk.addEventListener('click',()=>{ai=-1;drawAlbum()});
  gh.insertBefore(bk,gh.querySelector('.bk'));
  if(al.autoRatio){
    const items=al.items.filter(m=>m.src);
    if(!items.length){
      $('#gal').innerHTML='<div class="emp"><b>아직 이 앨범에 그림이 없어요</b><em>Pages CMS의 이미지 앨범에서 여러 이미지를 한 번에 추가해 주세요.</em></div>';
      setHint('이미지 앨범은 Pages CMS에서 관리');
      return;
    }
    $('#gal').innerHTML=`<section class="gg"><h4>그림 ${items.length}장</h4><div class="grid bulk-grid">`+items.map((m,i)=>{
      const c=C[i%4];
      const src=catalogImageUrl(m.src);
      const cap=String(m.cap||'');
      return `<button class="shot bulk-shot" style="--ratio:3 / 4;--c:${c}" data-s="${storyEscape(src)}" data-c="${storyEscape(cap)}"><span class="sv"><img src="${storyEscape(src)}" alt="${storyEscape(cap)}" loading="lazy"></span><span class="sc">${storyEscape(cap||'이름 없는 그림')}</span></button>`;
    }).join('')+'</div></section>';
    $('#gal').querySelectorAll('.bulk-shot img').forEach(img=>{
      const fitRatio=()=>{
        if(!img.naturalWidth||!img.naturalHeight)return;
        const shot=img.closest('.bulk-shot');
        if(shot)shot.style.setProperty('--ratio',`${img.naturalWidth} / ${img.naturalHeight}`);
      };
      if(img.complete)fitRatio();else img.addEventListener('load',fitRatio,{once:true});
    });
    $('#gal').querySelectorAll('.shot').forEach(sh=>sh.addEventListener('click',()=>{
      if(!sh.dataset.s){toast('먼저 이미지를 등록해 주세요.');return}
      const lightboxImage=$('#lb img');lightboxImage.onerror=()=>{lightboxImage.onerror=null;$('#lb p').textContent='이미지를 불러오지 못했어요. 저장된 이미지 주소를 확인해 주세요.'};lightboxImage.src=sh.dataset.s;$('#lb p').textContent=sh.dataset.c;$('#lb').classList.add('on')
    }));
    bindBrokenGalleryImages();
    setHint('그림을 눌러 크게 보기 · Esc로 앨범 목록으로');
    return;
  }
  const grp=[['landscape','가로 그림','4 / 3',m=>(m.w||4)>(m.h||3)],['portrait','세로 그림','3 / 4',m=>(m.w||4)<(m.h||3)],['square','정사각 그림','1 / 1',m=>(m.w||4)===(m.h||3)]]
    .map(([k,t,r,f])=>({k,t,r,it:al.items.filter(f)})).filter(g=>g.it.length);
  $('#gal').innerHTML=grp.map(g=>`<section class="gg"><h4>${g.t} ${g.it.length}장</h4><div class="grid ${g.k}">`+g.it.map(m=>{
    const c=C[al.items.indexOf(m)%4];
    const src=catalogImageUrl(m.src);
    const cap=String(m.cap||'');
    const inner=src?`<img src="${storyEscape(src)}" alt="${storyEscape(cap)}" loading="lazy">`:`<span class="ph" style="--c:${c}">${icon('photo',c)}그림 넣기</span>`;
    return `<button class="shot" style="--ratio:${g.r};--c:${c}" data-s="${storyEscape(src)}" data-c="${storyEscape(cap)}"><span class="sv">${inner}</span><span class="sc">${storyEscape(cap||'이름 없는 그림')}</span></button>`}).join('')+`</div></section>`).join('');
  $('#gal').querySelectorAll('.shot').forEach(sh=>sh.addEventListener('click',()=>{
    if(!sh.dataset.s){toast('여기에 이미지를 넣을 수 있어요.');return}
    const lightboxImage=$('#lb img');lightboxImage.onerror=()=>{lightboxImage.onerror=null;$('#lb p').textContent='이미지를 불러오지 못했어요. 저장된 이미지 주소를 확인해 주세요.'};lightboxImage.src=sh.dataset.s;$('#lb p').textContent=sh.dataset.c;$('#lb').classList.add('on')}));
  bindBrokenGalleryImages();
  setHint('▲ ▼ 내려보기 · ◀ ▶ 다른 앨범 · 그림을 눌러 크게 보기 · Esc 앨범 목록으로');
}

/* 버튼 입력 (키보드·화면 버튼 공통) */
function press(k){
  if($('#lb').classList.contains('on')){if(k==='b'||k==='a')$('#lb').classList.remove('on');return}
  if(busy)return;
  if(where==='home'){
    if(k==='l')rotate(-1);else if(k==='r')rotate(1);else if(k==='a')start(G[sel].id);
  }else if(where==='plat'){
    if(!PLATFORMS.length){if(k==='b')exit();return}
    if(k==='u'||k==='l')platMove(-1);
    else if(k==='d'||k==='r')platMove(1);
    else if(k==='a')openPlat();
    else if(k==='b')exit();
  }else if(where==='story'){
    const items=storyItems();
    if(k==='u'||k==='d'){
      if(items.length){const next=(storyIndex()+(k==='d'?1:items.length-1))%items.length;setStoryIndex(next);drawStory();}
    }else if(k==='l'||k==='r'){
      if(stLevel==='article'&&items.length){
        const n=stEntry+(k==='r'?1:-1);
        if(n>=0&&n<items.length){stEntry=n;scene.scrollTop=0;drawStory()}
      }
    }else if(k==='a'){
      if(storyLoadState!=='ready'||!STORIES.length)return;
      if(stLevel==='article'){
        const before=scene.scrollTop;scene.scrollBy(0,140);
        if(scene.scrollTop===before)toast('글을 다 읽었어요. Esc로 목록으로 돌아갈 수 있어요.');
      }else if(items.length)storyOpen();
    }else if(k==='b')storyBack();
  }else if(where==='cut'){
    const L=ALBUMS.length;
    if(!L)return;
    if(ai<0){
      if(k==='l'||k==='r'){ci=(ci+(k==='r'?1:L-1))%L;drawAlbum()}
      else if(k==='a'){ai=ci;drawAlbum()}
      else if(k==='b')exit();
    }else{
      if(k==='l'||k==='r'){ai=(ai+(k==='r'?1:L-1))%L;ci=ai;drawAlbum()}
      else if(k==='u')scene.scrollBy(0,-90);else if(k==='d')scene.scrollBy(0,90);
      else if(k==='b'){ai=-1;drawAlbum()}
    }
  }
}
const KEYS={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d',Enter:'a',' ':'a',Escape:'b',Backspace:'b'};
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea,select,[contenteditable="true"]')){if(e.key==='Escape'&&stEditing){e.preventDefault();stEditing=false;stEditTarget=null;drawStory()}return}const k=KEYS[e.key];if(!k)return;if(e.target.closest&&e.target.closest('button,a')&&(e.key==='Enter'||e.key===' '))return;e.preventDefault();press(k)});

/* 테마 */
$('#tLight').innerHTML=icon('sun','currentColor');$('#tDark').innerHTML=icon('moon','currentColor');
function theme(n){
  night=n;document.body.classList.toggle('night-mode',n);document.body.classList.toggle('day-mode',!n);scr.classList.toggle('night',n);bez.classList.toggle('night-mode',n);$('#tDark').classList.toggle('on',n);$('#tLight').classList.toggle('on',!n);
  const P=n?PAL.night:PAL.day;G.forEach((g,i)=>g.c=P[i]);
  if(where==='home')home();else enter(where);
}
$('#tLight').addEventListener('click',()=>theme(false));$('#tDark').addEventListener('click',()=>theme(true));
$('#lb').addEventListener('click',()=>$('#lb').classList.remove('on'));
theme(false);
</script>
<script>
/* 티스토리: 전에 작동했던 메인 주소로 열고, 원본 블로그 안에서 공개 글을 탐색합니다. */
const TISTORY_PUBLIC_URL = 'https://think10191.tistory.com/';
function cut(){
  const g = G[2];
  scene.innerHTML = `<div class="gh">${icon('bubble',g.c)}<span>${g.name}</span></div>
    <section class="tistory-page win" aria-label="티스토리 화면">
      <div class="tistory-browserbar">
        <span class="tistory-dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="tistory-address" title="${TISTORY_PUBLIC_URL}">think10191.tistory.com</span>
        <div class="tistory-browser-actions" aria-label="브라우저 도구">
          <button id="tistoryBack" type="button" aria-label="이전 페이지" title="이전 페이지">←</button>
          <button id="tistoryReload" type="button" aria-label="처음 화면 다시 불러오기" title="처음 화면 다시 불러오기">↻</button>
          <a href="${TISTORY_PUBLIC_URL}" target="_blank" rel="noopener noreferrer" aria-label="새 탭에서 열기" title="새 탭에서 열기">↗</a>
        </div>
      </div>
      <div class="tistory-viewport">
        <iframe class="tistory-iframe" id="tistoryFrame"
          title="think10191 티스토리 블로그"
          src="${TISTORY_PUBLIC_URL}"
          loading="eager"
          referrerpolicy="strict-origin-when-cross-origin"
          allow="storage-access https://think10191.tistory.com; clipboard-read; clipboard-write"></iframe>
      </div>
      <div class="tistory-note">공개 글은 게임기 안에서 탐색할 수 있어요. 보호글 인증이나 쿠키 문제가 생기면 ↗ 버튼으로 티스토리를 새 탭에서 열어 주세요.</div>
    </section>`;

  const blogFrame = $('#tistoryFrame');
  const sendParentTheme = () => {
    try {
      if(blogFrame && blogFrame.contentWindow){
        blogFrame.contentWindow.postMessage({type:'world-console-theme',mode:night?'dark':'light'}, 'https://think10191.tistory.com');
      }
    } catch (_) {}
  };
  blogFrame.addEventListener('load', sendParentTheme);
  sendParentTheme();
  $('#tistoryReload').addEventListener('click', () => { blogFrame.src = TISTORY_PUBLIC_URL; });
  $('#tistoryBack').addEventListener('click', () => {
    try { blogFrame.contentWindow.history.back(); }
    catch (_) { blogFrame.src = TISTORY_PUBLIC_URL; }
  });
  setHint('티스토리 화면 안에서 공개 글을 선택하세요 · Esc 홈으로');
}

/* 티스토리 화면 함수를 연결한 뒤 홈 메뉴를 다시 그립니다. */
if (where === 'home') home();
</script>
