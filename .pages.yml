media: media

content:
  - name: stories
    label: 사담 게시글
    type: file
    path: data/stories.json
    format: json
    list: true
    fields:
      - name: category
        label: 카테고리
        type: string
        required: true

      - name: subcategory
        label: 세부 카테고리
        type: string
        required: true

      - name: title
        label: 글 제목
        type: string
        required: true

      - name: date
        label: 작성일
        type: date
        required: true

      - name: body
        label: 본문
        type: text
        required: true