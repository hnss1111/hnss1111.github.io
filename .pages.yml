media: media

content:
  # Categories are managed as CMS collection entries. Create/edit them in the CMS;
  # posts reference the entries by their name, so the list is not hard-coded here.
  - name: story_categories
    label: 사담 카테고리
    type: collection
    path: data/story-categories
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: name
      sort: [name]
      default:
        sort: name
        order: asc
    fields:
      - name: name
        label: 카테고리 이름
        type: string
        required: true

  - name: story_subcategories
    label: 사담 세부 카테고리
    type: collection
    path: data/story-subcategories
    format: yaml-frontmatter
    filename: "{category}-{name}.md"
    view:
      primary: name
      sort: [name, category]
      default:
        sort: name
        order: asc
    fields:
      - name: name
        label: 세부 카테고리 이름
        type: string
        required: true

      - name: category
        label: 소속 카테고리
        type: reference
        options:
          collection: story_categories
          value: "{name}"
          label: "{name}"
        required: true

  - name: stories
    label: 사담 게시글
    type: file
    path: data/stories.json
    format: json
    list: true
    fields:
      - name: category
        label: 카테고리
        type: reference
        options:
          collection: story_categories
          value: "{name}"
          label: "{name}"
        required: true

      - name: subcategory
        label: 세부 카테고리
        type: reference
        options:
          collection: story_subcategories
          value: "{name}"
          label: "{name} ({fields.category})"
        required: true

      - name: title
        label: 글 제목
        type: string
        required: true

      - name: date
        label: 작성일
        type: date
        required: true

      - name: body
        label: 본문
        type: text
        required: true

  - name: platforms
    label: 사용 플랫폼
    type: file
    path: data/platforms.json
    format: json
    list: true
