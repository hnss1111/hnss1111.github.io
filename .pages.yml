media: media

content:
  # Categories are managed as CMS collection entries. Create/edit them in the CMS;
  # posts reference the entries by their name, so the list is not hard-coded here.
  - name: story_categories
    label: 사담 카테고리
    type: collection
    path: data/story-categories
    format: yaml-frontmatter
    extension: md
    filename: "{primary}.md"
    view:
      primary: name
      sort: [name]
      default:
        sort: name
        order: asc
    fields:
      - name: name
        label: 카테고리 이름
        type: string
        required: true

  - name: story_subcategories
    label: 사담 세부 카테고리
    type: collection
    path: data/story-subcategories
    format: yaml-frontmatter
    extension: md
    filename: "{category}-{name}.md"
    view:
      primary: name
      sort: [name, category]
      default:
        sort: name
        order: asc
    fields:
      - name: name
        label: 세부 카테고리 이름
        type: string
        required: true

      - name: category
        label: 소속 카테고리
        type: reference
        options:
          collection: story_categories
          value: "{fields.name}"
          label: "{fields.name}"
        required: true

  - name: stories
    label: 사담 게시글
    type: file
    path: data/stories.json
    format: json
    list: true
    fields:
      - name: category
        label: 카테고리
        type: reference
        options:
          collection: story_categories
          value: "{fields.name}"
          label: "{fields.name}"
        required: true

      - name: subcategory
        label: 세부 카테고리
        type: reference
        options:
          collection: story_subcategories
          value: "{fields.name}"
          label: "{fields.name} ({fields.category})"
        required: true

      - name: title
        label: 글 제목
        type: string
        required: true

      - name: date
        label: 작성일
        type: date
        required: true

      - name: body
        label: 본문
        type: text
        required: true

  - name: platforms
    label: 사용 플랫폼
    type: file
    path: data/platforms.json
    format: json
    list: true
    fields:
      - name: name
        label: 플랫폼 이름
        type: string
        required: true

      - name: url
        label: 플랫폼 링크
        type: string
        required: true
        description: https://로 시작하는 전체 주소를 넣어 주세요.

  - name: gallery
    label: 이미지 앨범
    type: file
    path: data/gallery.json
    format: json
    list: true
    fields:
      - name: name
        label: 앨범 이름
        type: string
        required: true

      - name: cover
        label: 앨범 대표 이미지 (언제든 변경 가능)
        type: image
        options:
          path: gallery
          extensions: [png, jpg, jpeg, webp]
          rename: safe
        description: 비워 두면 첫 번째 앨범 이미지가 대표 이미지로 자동 사용됩니다. 나중에 여기서 다른 이미지로 바꿀 수 있어요.

      - name: images
        label: 앨범 이미지 (여러 장 한 번에 선택)
        type: image
        options:
          path: gallery
          multiple:
            max: 200
          unique: true
          extensions: [png, jpg, jpeg, webp]
          rename: safe
        description: 여러 이미지를 한 번에 선택할 수 있어요. 파일명에서 이미지 설명을 만들고, 화면 비율은 자동으로 맞춰집니다.
