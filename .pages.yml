media: media

content:
  - name: stories
    label: 사담 게시글
    type: file
    path: data/stories.json
    format: json
    list: true
    fields:
      - name: category
        label: 카테고리
        type: string
        required: true
        description: 기존 카테고리 이름을 입력해 주세요.

      - name: subcategory
        label: 세부 카테고리
        type: string
        required: true
        description: 기존 세부 카테고리 이름을 입력해 주세요.

      - name: title
        label: 글 제목
        type: string
        required: true

      - name: date
        label: 작성일
        type: date
        required: true

      - name: body
        label: 본문
        type: text
        required: true

  - name: platforms
    label: 사용 플랫폼
    type: file
    path: data/platforms.json
    format: json
    list: true
    fields:
      - name: name
        label: 플랫폼 이름
        type: string
        required: true

      - name: url
        label: 플랫폼 링크
        type: string
        required: true
        description: https://로 시작하는 전체 주소를 넣어 주세요.

  - name: gallery
    label: 이미지 앨범
    type: file
    path: data/gallery.json
    format: json
    list: true
    fields:
      - name: name
        label: 앨범 이름
        type: string
        required: true

      - name: cover
        label: 앨범 대표 이미지
        type: image
        options:
          path: gallery
          extensions: [png, jpg, jpeg, webp]
          rename: safe
        description: 비워 두면 첫 번째 앨범 이미지가 대표 이미지로 자동 사용됩니다.

      - name: images
        label: 앨범 이미지
        type: image
        options:
          path: gallery
          multiple:
            max: 200
          unique: true
          extensions: [png, jpg, jpeg, webp]
          rename: safe
        description: 여러 이미지를 한 번에 선택할 수 있습니다.