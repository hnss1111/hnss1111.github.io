media: media

content:
  - name: story_categories
    label: 사담 카테고리
    type: collection
    path: data/story-categories
    format: json
    filename: "{name}.json"
    exclude: [README.md]
    view:
      primary: name
      sort: [name]
      default:
        sort: name
        order: asc
    fields:
      - name: name
        label: 카테고리 이름
        type: string
        required: true

  - name: story_subcategories
    label: 사담 세부 카테고리
    type: collection
    path: data/story-subcategories
    format: json
    filename: "{category}-{name}.json"
    exclude: [README.md]
    view:
      primary: name
      sort: [name, category]
      default:
        sort: name
        order: asc
    fields:
      - name: name
        label: 세부 카테고리 이름
        type: string
        required: true

      - name: category
        label: 소속 카테고리
        type: reference
        options:
          collection: story_categories
          value: "{name}"
          label: "{name}"
        required: true

  - name: stories
    label: 사담 게시글
    type: file
    path: data/stories.json
    format: json
    list: true
    fields:
      - name: category
        label: 카테고리
        type: reference
        options:
          collection: story_categories
          value: "{name}"
          label: "{name}"
        required: true

      - name: subcategory
        label: 세부 카테고리
        type: reference
        options:
          collection: story_subcategories
          value: "{name}"
          label: "{name} ({fields.category})"
        required: true

      - name: title
        label: 글 제목
        type: string
        required: true

      - name: date
        label: 작성일
        type: date
        required: true

      - name: body
        label: 본문
        type: text
        required: true

  - name: platforms
    label: 사용 플랫폼
    type: file
    path: data/platforms.json
    format: json
    list: true
    fields:
      - name: name
        label: 플랫폼 이름
        type: string
        required: true

      - name: url
        label: 플랫폼 링크
        type: string
        required: true
        description: https://로 시작하는 전체 주소를 넣어 주세요.

  - name: gallery
    label: 이미지 앨범
    type: file
    path: data/gallery.json
    format: json
    list: true
    fields:
      - name: name
        label: 앨범 이름
        type: string
        required: true

      - name: cover
        label: 앨범 대표 이미지
        type: image
        options:
          extensions: [png, jpg, jpeg, webp]
          rename: true

      - name: items
        label: 앨범 이미지 목록
        type: object
        list: true
        fields:
          - name: src
            label: 이미지 파일
            type: image
            options:
              extensions: [png, jpg, jpeg, webp]
              rename: true

          - name: cap
            label: 이미지 설명
            type: string

          - name: w
            label: 가로 비율 값
            type: number
            description: 가로 그림은 4, 세로 그림은 3, 정사각형은 1을 입력해 주세요.
            required: true

          - name: h
            label: 세로 비율 값
            type: number
            description: 가로 그림은 3, 세로 그림은 4, 정사각형은 1을 입력해 주세요.
            required: true
